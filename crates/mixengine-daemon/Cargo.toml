[package]
name = "mixengine-daemon"
description = "The mixengined binary: owns all state, serves the JSON-RPC API, orchestrates everything else."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mixengined"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
mixengine-core.workspace = true
mixengine-platform.workspace = true
mixengine-proto.workspace = true
mixengine-supervisor.workspace = true
# The one line `tracing` cannot write for us: the note a failed rotation leaves behind has to be a
# JSON object when the rest of the file is, and hand-escaping an OS error message is how a log
# stops parsing.
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tracing.workspace = true
# `json` is `log.format = "json"` / `MIXENGINE_LOG_FORMAT=json`: one object per line for a
# collector, rather than a second formatter written here.
tracing-subscriber = { workspace = true, features = ["json"] }

[dev-dependencies]
# Only so the error-mapping tests can build the failures they are about: `sqlx::Error` and
# `MigrateError` are what `mixengine_core::Error` carries, and a test that cannot construct one
# would have to prove the mapping by corrupting a real database instead.
sqlx.workspace = true
tempfile.workspace = true

[lints]
workspace = true
