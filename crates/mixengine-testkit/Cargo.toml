[package]
name = "mixengine-testkit"
description = "Fixtures shared by the test suites: a temporary home, the `fakeservice` binary, and the one way this workspace stops a process by pid."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

# A **dev-dependency only**, enforced by `crates/mixengine-proto/tests/workspace_layering.rs`: this
# crate exists to be linked into test binaries and never into `mixengined`, `mix` or
# `mixengine-elevate`. That is also why it may do things the product may not — see `process.rs` for
# the one OS-dependent body outside `mixengine-platform` in this workspace, and why it is here.

[dependencies]
# `Endpoint`, so a fixture home can name the endpoint a daemon for it will bind; `Signals` and
# `spawn_detached`, which are how `fakeservice` ignores a stop and leaves an orphan behind without a
# `#[cfg]` of its own — the same code paths the daemon uses, which makes the fixture a second user of
# them rather than a second answer to them.
mixengine-platform.workspace = true
# The `services` row a test has to write itself until T30 can create one — see `declare.rs`. The
# same package `mixengine-core` already pulls in, so this is an edge and not a new dependency, and
# it stays on this side of the dev-dependency line with everything else here.
sqlx.workspace = true
# `fakeservice` alone. It is a binary of this package, so it shares the manifest with the library the
# test suites link against — the cost is one crate in a dev-dependency tree.
clap.workspace = true
tempfile.workspace = true
# `MockRegistry` serves a real index over a real socket, because the two things worth testing about
# an index client — does it check the signature, does it use the cache — are exactly the two a fake
# client would answer by construction. The same HTTP stack the daemon serves its API with, so this
# is an edge and not a new package.
http-body-util.workspace = true
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
# The signing half of the pair whose verifying half `mixengine-core` links. It lives here and can
# live nowhere else: a shipped binary holding a signing key would be a signing key on every user's
# machine. The dev-dependency line that `workspace_layering.rs` enforces is what keeps it there.
minisign = "0.7.9"
# `FakePackage`: a real archive in each of the three shapes the publishing pipeline produces, so an
# install test unpacks what a user would rather than what a mock decided to hand it. The writing
# halves of what `mixengine-core` reads with — and `zstd` is deliberately *not* the `ruzstd` the
# product uses, on the same principle as `minisign`/`minisign-verify` above: a fixture built with
# the same implementation it is decoded by proves the two agree with themselves.
flate2.workspace = true
tar.workspace = true
zip.workspace = true
zstd.workspace = true
# The fixture states the hash of what it produced, because a test that asked the code under test
# for it would be asserting nothing.
sha2.workspace = true
serde_json.workspace = true
# `current_thread` for the fixture's own runtime, `time` for its timers, `macros` for the `select!`
# that ties them together, `net` for the registry's listener.
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }

[lints]
workspace = true
