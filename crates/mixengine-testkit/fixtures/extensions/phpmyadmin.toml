schema = 1

[extension]
id = "phpmyadmin"
name = "phpMyAdmin"
version = "5.2.3"
kind = "web-app"
description = "Web front end for MySQL and MariaDB"
homepage = "https://www.phpmyadmin.net"

[artifact.any]
url = "https://files.phpmyadmin.net/phpMyAdmin/5.2.3/phpMyAdmin-5.2.3-all-languages.zip"
sha256 = "2d2e13c735366d318425c78e4ee2cc8fc648d77faba3ddea2cd516e43885733f"
size = 16431330

[web-app]
# **The archive's own top level**, because `Installer` unpacks an artifact as it is. Not `app`, which
# is what a fixture invented for the parser would say; `site show`'s `doc_root_exists` is what
# reports a wrong one.
root = "{install_dir}/phpMyAdmin-5.2.3-all-languages"
domain = "phpmyadmin"

[web-app.database]
engines = ["mariadb", "mysql"]

[web-app.runtime]
# `composer.json` requires `^7.2.5 || ^8.0`, which this grammar cannot say. `^8.0` is what it can:
# every PHP 8 this repository offers, which is every PHP 8 phpMyAdmin supports.
kind = "php"
requires = "^8.0"

[web-app.config]
# `libraries/vendor_config.php` fixes this at `ROOT_PATH . 'config.inc.php'` — hard-coded, with no
# environment override — so there is exactly one place it can go.
path = "config.inc.php"
text = """
<?php
// Generated by MixEngine. This file is rewritten whenever the daemon starts; your own settings go
// in the file included at the end, which lives outside this directory and outlives an uninstall.
declare(strict_types=1);

$cfg['blowfish_secret'] = '{secret}';

// The archive ships no `tmp/`, and the directory this points at is kept when the extension is
// removed.
$cfg['TempDir'] = '{data_dir}';

$i = 1;
$cfg['Servers'][$i]['host'] = '{db_host}';
$cfg['Servers'][$i]['port'] = '{db_port}';
$cfg['Servers'][$i]['user'] = '{db_user}';
$cfg['Servers'][$i]['connect_type'] = 'tcp';
$cfg['Servers'][$i]['AllowNoPassword'] = false;

// **No password here.** MixEngine keeps this server's credential in the OS keyring and does not
// write it to disk; `mix service credentials` says where it is stored. Signing in without typing it
// needs a php-fpm pool of this extension's own, which is roadmap task T82a.
$cfg['Servers'][$i]['auth_type'] = 'cookie';

@include '{data_dir}/config.user.php';
"""

[permissions]
services = ["read"]
network = "loopback"
filesystem = ["own-data"]
