schema = 1

[extension]
id = "phpmyadmin"
name = "phpMyAdmin"
version = "5.2.3"
kind = "web-app"
description = "Web front end for MySQL and MariaDB"
homepage = "https://www.phpmyadmin.net"

[artifact.any]
url = "https://files.phpmyadmin.net/phpMyAdmin/5.2.3/phpMyAdmin-5.2.3-all-languages.zip"
sha256 = "2d2e13c735366d318425c78e4ee2cc8fc648d77faba3ddea2cd516e43885733f"
size = 16431330

[web-app]
# **The archive's own top level**, because `Installer` unpacks an artifact as it is. Not `app`, which
# is what a fixture invented for the parser would say; `site show`'s `doc_root_exists` is what
# reports a wrong one.
root = "{install_dir}/phpMyAdmin-5.2.3-all-languages"
domain = "phpmyadmin"

[web-app.database]
engines = ["mariadb", "mysql"]
# **Handed the server's superuser password, in this application's own php-fpm pool** — roadmap task
# **T82a**. The variable's name is deliberately not written here: `{db_password_env}` below renders
# it, so a manifest cannot collide with `PATH` or with the variables the pool itself is configured
# through, and there is no name to keep in step with MixEngine.
signs_in = true

[web-app.runtime]
# `composer.json` requires `^7.2.5 || ^8.0`, which this grammar cannot say. `^8.0` is what it can:
# every PHP 8 this repository offers, which is every PHP 8 phpMyAdmin supports.
kind = "php"
requires = "^8.0"

[web-app.config]
# `libraries/vendor_config.php` fixes this at `ROOT_PATH . 'config.inc.php'` — hard-coded, with no
# environment override — so there is exactly one place it can go.
path = "config.inc.php"
text = """
<?php
// Generated by MixEngine. This file is rewritten whenever the daemon starts; your own settings go
// in the file included at the end, which lives outside this directory and outlives an uninstall.
declare(strict_types=1);

$cfg['blowfish_secret'] = '{secret}';

// The archive ships no `tmp/`, and the directory this points at is kept when the extension is
// removed.
$cfg['TempDir'] = '{data_dir}';

$i = 1;
$cfg['Servers'][$i]['host'] = '{db_host}';
$cfg['Servers'][$i]['port'] = '{db_port}';
$cfg['Servers'][$i]['user'] = '{db_user}';
$cfg['Servers'][$i]['connect_type'] = 'tcp';
$cfg['Servers'][$i]['AllowNoPassword'] = false;

// **The password is read from this process's environment and is nowhere on disk** — roadmap task
// T82a. MixEngine's supervisor takes it out of the OS keyring at the moment this application's own
// php-fpm pool is spawned, and `clear_env = no` in that pool is what lets a worker see it; a
// password on disk would be a password every process on this machine can read.
//
// `getenv` and not `$_ENV`: `variables_order` decides whether `$_ENV` is populated at all, and its
// default does not include `E`. The cast is for the same defensiveness — `getenv` answers `false`
// for a variable that is not there, and `AllowNoPassword` above is what then refuses the connection
// legibly instead of connecting as root with no password.
$cfg['Servers'][$i]['password'] = (string) getenv('{db_password_env}');
$cfg['Servers'][$i]['auth_type'] = 'config';

@include '{data_dir}/config.user.php';
"""

[permissions]
services = ["read"]
network = "loopback"
filesystem = ["own-data"]
