schema = 1

[extension]
id = "adminer"
name = "Adminer"
version = "6.0.1"
kind = "web-app"
description = "Database management in a single PHP file"
homepage = "https://www.adminer.org"

[artifact.any]
# **One file, not an archive** — roadmap task **T82**, the design's D3. This is what upstream
# publishes as its distribution; the `.zip` beside it is the development source tree.
url = "https://github.com/vrana/adminer/releases/download/v6.0.1/adminer-6.0.1.php"
sha256 = "1815c03f26e21d533e729c0b09bc69a59c902a6440409d013105ee679dff006c"
size = 519492

[web-app]
# The file lands here under the name its URL ends with, beside the `index.php` below.
root = "{install_dir}"
domain = "adminer"

[web-app.database]
engines = ["mariadb", "mysql", "postgres"]

[web-app.runtime]
kind = "php"
requires = "^8.0"

[web-app.config]
path = "index.php"
text = """
<?php
// Generated by MixEngine. `adminer/include/bootstrap.inc.php` looks for `Adminer\\\\adminer_object`
// from inside `namespace Adminer`, which is the documented way to hand Adminer a default server.
namespace Adminer;

function adminer_object() {
    class MixEngine extends Adminer {
        function credentials() {
            return ['{db_host}:{db_port}', '{db_user}', get_password()];
        }

        function name() {
            return 'Adminer on MixEngine';
        }
    }

    return new MixEngine;
}

// `__DIR__` and not `./`: a relative include is a bet on the working directory.
include __DIR__ . '/adminer-6.0.1.php';
"""

[permissions]
services = ["read"]
network = "loopback"
filesystem = ["own-data"]
