schema = 1

[extension]
id = "adminer"
name = "Adminer"
version = "6.0.1"
kind = "web-app"
description = "Database management in a single PHP file"
homepage = "https://www.adminer.org"

[artifact.any]
# **One file, not an archive** — roadmap task **T82**, the design's D3. This is what upstream
# publishes as its distribution; the `.zip` beside it is the development source tree.
url = "https://github.com/vrana/adminer/releases/download/v6.0.1/adminer-6.0.1.php"
sha256 = "1815c03f26e21d533e729c0b09bc69a59c902a6440409d013105ee679dff006c"
size = 519492

[web-app]
# The file lands here under the name its URL ends with, beside the `index.php` below.
root = "{install_dir}"
domain = "adminer"

[web-app.database]
engines = ["mariadb", "mysql", "postgres"]

[web-app.runtime]
kind = "php"
requires = "^8.0"

[web-app.config]
path = "index.php"
text = """
<?php
// Generated by MixEngine.
//
// **The hook is global and everything it needs is not.** Adminer runs
// `Adminer::$instance = function_exists('adminer_object') ? adminer_object() : …` from inside
// `namespace Adminer`, and `function_exists` never applies the current namespace to a string — so
// the function it looks for is the *global* `adminer_object`, while the class to extend is
// `\\Adminer\\Adminer` and the password reader is `\\Adminer\\get_password`. A wrapper that puts
// itself in `namespace Adminer` is never called at all, and one that leaves everything unqualified
// dies on `Class "Adminer" not found`. Both were measured against the published file.
//
// The class is declared inside the function because `Adminer\\Adminer` does not exist until the
// include below has run, and a function body is not compiled until it is called.
function adminer_object() {
    class MixEngineAdminer extends \\Adminer\\Adminer {
        function credentials() {
            return ['{db_host}:{db_port}', '{db_user}', \\Adminer\\get_password()];
        }
    }

    return new MixEngineAdminer;
}

// `__DIR__` and not `./`: a relative include is a bet on the working directory.
include __DIR__ . '/adminer-6.0.1.php';
"""

[permissions]
services = ["read"]
network = "loopback"
filesystem = ["own-data"]
