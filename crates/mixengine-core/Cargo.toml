[package]
name = "mixengine-core"
description = "Domain logic: projects, sites, runtimes, services, config rendering, blueprints. No I/O of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mixengine-platform.workspace = true
mixengine-proto.workspace = true
# The three shapes the publishing pipeline packs, and nothing that writes one: `flate2` and `ruzstd`
# decompress `.tar.gz` and `.tar.zst`, `tar` unpacks what is inside either, and `zip` reads the
# Windows half. Extraction is where an archive would get to choose where its bytes land, which is
# why the entry paths are checked here before any of these is asked to write — see
# `install::archive`.
flate2.workspace = true
ruzstd.workspace = true
tar.workspace = true
zip.workspace = true
# What every download is checked against before it is unpacked. The hash is pinned in the index the
# signature above already established is ours, so this is what carries that trust the rest of the
# way to the bytes on disk.
sha2.workspace = true
# Rendering every generated config file (`generate`). It lives in this crate rather than in the
# daemon for the reason the whole module does: what a service's configuration *is* is domain
# knowledge, and the daemon is what decides when to ask for it.
minijinja.workspace = true
# Verifying the package index. Kept next to the fetch rather than pushed up into the daemon because
# an index read from the cache goes through the same check as one read from the network, and
# splitting the two would leave the disk path trusting a file any local process can rewrite.
minisign-verify.workspace = true
# The one place this crate speaks to a network. Whether to go to the network at all *is* the cache
# policy, so the fetch lives beside the freshness rule that triggers it — the same reasoning that
# puts `sqlx` here rather than in the daemon.
reqwest.workspace = true
serde.workspace = true
# `jobs.result_json` is the one column this crate reads and writes as a document rather than as a
# value: what a job produced belongs to the method that produced it, so `JobOutcome` carries a
# `serde_json::Value` and this crate is what puts it in the column. Everywhere else, a `*_json`
# column is parsed by whoever owns its shape.
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
# T21 is the first task in this crate with work long enough to need the runtime rather than only the
# `async` keyword. `rt` is `spawn_blocking`, which hashing and unpacking an eighty-megabyte archive
# both go through — doing either inline would stall every other request the daemon is serving. `fs`
# and `io-util` write the download without blocking between chunks, `process` runs the post-install
# check, and `time` bounds it. Everything above this line was reachable with none of them, which is
# why the dependency arrives now rather than at the top of the file's history.
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "time"] }
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true

[dev-dependencies]
# `MockRegistry`: a signed index over a real socket, which is the only way an index client can be
# tested without the network `.claude/standards/testing.md` forbids. A dev-dependency edge, which is
# the only kind this crate may have on the testkit.
mixengine-testkit.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
