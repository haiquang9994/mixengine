; Generated by MixEngine — roadmap task T32. Every value here comes from the `services` row and its
; overrides; editing this file is editing something that is rewritten on the next `service.*` call.
; What a user edits is an override.

[global]
; Stated rather than left to php-fpm's own default, which is a path compiled into the build and
; therefore somewhere in whoever packaged it's tree. `--nodaemonize` on the command line means the
; process the supervisor holds is the master itself, so there is no pid file to reconcile — but a
; php-fpm that is asked to log and cannot say where sends the answer nowhere anybody looks.
error_log = {{ paths.logs }}/php-fpm.log

; The master must not fork away from the supervisor. Also given as `--nodaemonize` on the command
; line, and stated in both places on purpose: a flag omitted by mistake is a service that appears to
; exit successfully the moment it starts.
daemonize = no

[www]
; The same path the readiness check waits on, computed twice — once here for the server and once in
; Rust for the daemon — because a template cannot call a function and a spec cannot read a file.
; `the_file_and_the_readiness_check_name_one_socket` is what keeps the two honest: when they disagree
; the pool starts perfectly and is reported as never having come up.
;
; In `run/` and not beside the data directory, and short on purpose: `sockaddr_un` caps a socket path
; at 103 characters (measured in T33a) and a server given a longer one aborts *after* it has started,
; in a way that reads like a storage failure. The recipe refuses such a path by name before php-fpm
; can.
;
; **Named after the instance and not after the version** — roadmap task T82a. For every pool
; `pools::ensure` makes the two are the same string, so no existing home's socket moves; what makes
; them differ is the pool a `web-app` extension owns, which runs out of the same PHP as the shared
; one and must not answer on the same socket.
listen = {{ paths.run }}/php-fpm-{{ service.instance_or_name }}.sock

; `static` and not `dynamic`, and this is the one place the two systems would otherwise diverge:
; Windows has no vocabulary for a pool that grows, so an override that worked on two systems out of
; three would be the split this whole task exists to avoid. A fixed pool of `max_children` is what
; both can express.
pm = static
pm.max_children = {{ settings.max_children }}

; A worker is retired after this many requests and replaced. What it buys is a leak in an extension
; costing a fixed amount of memory instead of a growing one; zero turns it off.
pm.max_requests = {{ settings.max_requests }}

; The status page the daemon reads to decide whether anybody is using this pool — roadmap task
; **T72a**. Asked over FastCGI on the socket above, never through a front end: both of them hand
; FastCGI only what matches `.php`, and this path deliberately does not. The same string is
; `STATUS_PATH` in the recipe, which is what the probe asks for.
;
; **`pm.status_listen` is deliberately absent.** A listener of its own would leave this pool's own
; counters untouched by the reading — measured, and it is the cleaner arithmetic — but it exists only
; from PHP 8.0, while MixEngine offers PHP from 7.0 upwards on purpose. php-fpm does not ignore a
; directive it does not know: `--test` refuses the whole file, so that one line would stop a 7.4 pool
; from starting at all. The daemon subtracts its own request instead.
pm.status_path = /mixengine-status
{% if service.inherits_environment %}
; **This pool's workers inherit the master's environment** — roadmap task T82a, the design's D3.
;
; php-fpm clears a worker's environment unless it is told otherwise, and the only other way to hand
; a worker a value is `env[NAME] = <literal>` — which performs no expansion, so it would mean
; writing a database superuser's password into this file. This directive is what lets the credential
; be reachable by `getenv()` while existing only in a process: the supervisor reads it out of the OS
; keyring when it spawns the master, and the workers inherit it at fork.
;
; **What that actually exposes is short and knowable.** The master's own environment is
; `env_clear()` plus this platform's short inherited floor — `PATH`, `HOME`, the locale — plus what
; the spec states, which is `PHP_INI_SCAN_DIR` and the credential. Not the daemon's environment,
; which holds no secret of its own: they are in the keyring, read once per spawn.
;
; **Rendered only for the pool a `web-app` extension owns.** Every other pool in this home leaves
; php-fpm's own `clear_env = yes` in place, which is what keeps a project's PHP unable to read this.
clear_env = no
{% endif %}

; A worker that runs longer than this is killed and replaced, which is a hung script costing one
; worker for a bounded time rather than one worker forever. **There is no equivalent on Windows** —
; see the recipe's module note.
request_terminate_timeout = {{ settings.request_timeout }}

; Whatever a script writes to stdout beyond its response goes to `error_log` above rather than to
; nowhere, which is the difference between a fatal error somebody can read and a blank page.
catch_workers_output = yes

; There is deliberately no `include=.../pool.d/*.conf` here, and the reason is php-fpm's rather than
; ours: a glob whose *directory* does not exist is a hard error — `Unable to globalize ... (ret=2)`,
; measured against 8.3.33 — and not the warning an empty directory gets. The directory cannot exist
; at the moment it would first be needed, because `include` takes an absolute path that does not
; resolve against the file it is written in, so it names the installed directory while
; `php-fpm --test` is run over the *staged* one, before anything has been installed at all. A line
; that refuses to validate on the first render buys less than the ownership it was there to signal,
; so Phase 4 adds it together with the directory it renders into — see the recipe's module note.

{{ extra }}
