# Generated by MixEngine for {{ service.id }} from {{ package.name }} {{ package.version }}.
# Every edit here is overwritten on the next start. What you change is an override on the service.
#
# Every path below is forward-slashed and quoted, on both counts deliberately: nginx's own
# `ngx_conf_read_token` treats `\` inside a quoted string as an escape, so a home under
# `C:\Users\Nguyen Hai Quang` arrives with every separator eaten — and unquoted, the directive stops
# at the space instead. nginx accepts `/` on Windows, so one spelling works on all three systems.

# **In the foreground.** The default forks a master and returns, which leaves the supervisor
# watching a launcher that has already exited. Caddy's template makes the same decision by running
# `caddy run` rather than `caddy start`.
daemon off;

# One worker, not `auto`. Upstream's own Windows build starts several of which one does any work —
# it says so in the artifact's `lacks` — and a development machine serving one developer has nothing
# for the others to do on the systems where they would work.
worker_processes {{ settings.worker_processes }};

# **To the stream, where `mix service logs` is reading.** The command line carries `-e stderr` as
# well, and the two cover different halves: this line is in force once the configuration has been
# read, and the flag is what catches an error in reading it — which otherwise goes to the
# compiled-in `logs/error.log` under the prefix, a file nobody is looking at.
error_log stderr {{ settings.log_level }};

# Under `run/` rather than the compiled-in `logs/nginx.pid`, and it matters more than a tidier
# location: `-s reload` and `-s quit` read this file through this same configuration, so where it is
# written is how a signal finds *this* instance.
pid "{{ paths.run | replace('\\', '/') }}/{{ service.id }}.pid";

events {
    worker_connections {{ settings.worker_connections }};
}

http {
    # The archive's own copy, by the absolute path the index publishes it at. A generated
    # configuration has no `conf/` beside it, which is what the package's `provides` map is for.
    include "{{ paths.includes['mime.types'] | replace('\\', '/') }}";
    default_type application/octet-stream;

    # **Children of the data directory, which already exists.** nginx creates each of these with a
    # single `mkdir` rather than a chain, so a missing parent is `[emerg] CreateDirectory() failed`
    # on a configuration that passed `nginx -t` one line earlier. `Generator::render` makes the data
    # directory; nothing makes a `temp/` under it, so nothing is under one.
    client_body_temp_path "{{ paths.data | replace('\\', '/') }}/client_body_temp";
    proxy_temp_path "{{ paths.data | replace('\\', '/') }}/proxy_temp";
    fastcgi_temp_path "{{ paths.data | replace('\\', '/') }}/fastcgi_temp";
    scgi_temp_path "{{ paths.data | replace('\\', '/') }}/scgi_temp";
    uwsgi_temp_path "{{ paths.data | replace('\\', '/') }}/uwsgi_temp";

    # Off, and **T43 decided to leave it off**. A per-site access log was the alternative: MixEngine
    # captures and rotates what a service writes to its stream, nginx cannot write an access log
    # there on Windows, and a second set of files growing under `logs/` that nothing rotates is
    # exactly what that capture exists to prevent. It becomes worth having when there is something
    # that reads it.
    access_log off;

    sendfile on;
    keepalive_timeout 65;

    # The default is a megabyte, which a developer meets as a 413 the first time they upload
    # anything. A local machine is not where that limit earns its keep.
    client_max_body_size {{ settings.client_max_body_size }};

    # **The endpoint this recipe answers readiness and health on**, and the reason it exists at all:
    # nginx has no admin endpoint, and a TCP accept is not a substitute — the master holds the
    # listening socket, so a connection is accepted exactly the same way when every worker is gone.
    # A request that comes back 200 was served by a worker reading this configuration.
    #
    # Loopback whatever the service binds, deliberately: this says whether MixEngine's own front end
    # is up, which is nobody else's business. `bind_addr` is about sites, and LAN sharing is about
    # that one.
    server {
        listen 127.0.0.1:{{ settings.status_port }};
        server_name mixengine;

        location = /mixengine/health {
            return 200 "mixengine\n";
        }

        location / {
            return 404;
        }
    }

    # One file per site, and no shared file anybody appends to: a site whose configuration is broken
    # fails validation on its own rather than taking the other twelve down with it.
    #
    # **The glob resolves against the prefix**, which is this file's own directory at run time and
    # the staging directory while `nginx -t` is judging it — so the whole rendering is checked where
    # it is staged, includes and all, and only then installed. That is Caddy's `import sites/*.caddy`
    # arrangement reached by a different rule, and it is why `-p` is passed in both places rather
    # than left to a compiled-in default. Sites arrive in Phase 4; until then this matches nothing,
    # which nginx accepts in silence.
    include sites/*.conf;

    # One file per installed extension that declared a `[[recipe.front_end]]` for nginx — roadmap
    # task T81c. Inside `http` and beside the sites, which is what a fragment is written against: a
    # `map`, an `upstream`, a `server` on a loopback port. A second glob rather than a second name in
    # the one above, because the two directories have different lifetimes — `sites/` follows the
    # `sites` table and this one follows `extensions`.
    #
    # **A fragment here is judged before it is ever installed.** `extension.install` renders this
    # whole file with the prospective fragment in it and runs `nginx -t` over the staged copy, so a
    # fragment nginx will not parse stops the install rather than this rendering.
    include extensions/*.conf;

    {{ extra }}
}
