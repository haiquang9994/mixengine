# Generated by MixEngine for {{ service.id }} from {{ package.name }} {{ package.version }}.
# Every edit here is overwritten on the next start. What you change is an override on the service.

# Loopback, and `protected-mode` behind it as the second lock on the same door. A cache holds
# whatever a site put in it — sessions, tokens, rendered pages — and reaches the network with no
# password at all by default. LAN sharing is a decision somebody makes about a *site*, not a
# default a key/value store arrives with.
bind {{ service.bind }}
protected-mode yes
port {{ service.port }}

# **In the foreground, and its log on the stream.** `daemonize yes` forks and returns, which leaves
# the supervisor watching a process that has already exited; an empty `logfile` is Redis's own
# spelling for standard output, which is where `mix service logs` is reading from.
daemonize no
logfile ""

# Where a dump would go if there were one. Redis resolves several relative paths against this
# rather than against the working directory, so it is set even though nothing below writes.
#
# **Single quotes, and that is the whole of what makes a Windows path work here.** Redis's
# `sdssplitargs` processes escapes inside double quotes — `\n`, `\xNN`, and any other `\<char>` as
# the character alone — so `"C:\Users\you\..."` arrives with every backslash eaten and the server
# refuses the entire file with *No such file or directory*, naming a directory that is right there.
# Inside single quotes only `\'` is an escape. Caddy's template makes the same point with backticks,
# for the same reason, in that program's spelling.
dir '{{ paths.data }}'

# **Nothing is ever written to disk.** An empty `save` removes every snapshot point rather than
# adding one, and the append-only file is off; between them this instance holds its dataset in
# memory and loses it on a stop, which is what a development cache is for. A user who wants a
# key/value store that survives a restart is asking for a different service, and MixEngine would
# rather be told that than half-do it.
save ""
appendonly no

# A ceiling and what to do at it. Without a policy Redis refuses writes once it is full, which
# arrives at the site as an error from a cache — the one component whose failure should be a miss.
maxmemory {{ settings.maxmemory }}
maxmemory-policy {{ settings.maxmemory_policy }}

databases {{ settings.databases }}
loglevel {{ settings.loglevel }}

{{ extra }}
