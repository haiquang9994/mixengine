# Generated by MixEngine for {{ service.id }} — do not edit.
#
# Everything here comes from the `services` row and from this instance's overrides. Edit those:
# `mix service set {{ service.id }} <key> <value>`. This file is rewritten on every start and any
# change made here is lost without ever being read.
#
# **This is not the `postgresql.conf` `initdb` wrote.** That one is inside the data directory and
# the server never reads it: the server is started with `--config-file` pointing here. That is what
# lets generated configuration stay disposable while the data directory stays sacred.
#
# Every path is single-quoted and forward-slashed. PostgreSQL's parser reads `\` inside a quoted
# string as an escape, and a home under `C:\Users\Nguyen Hai Quang` is a real user.

data_directory = '{{ paths.data | replace('\\', '/') }}'
hba_file = '{{ paths.etc | replace('\\', '/') }}/pg_hba.conf'
ident_file = '{{ paths.etc | replace('\\', '/') }}/pg_ident.conf'

listen_addresses = '{{ service.bind }}'
port = {{ service.port }}
{%- if paths.socket %}

# The *directory* the socket goes in, which is what this setting takes — the file inside it is
# `.s.PGSQL.<port>`, and it is that whole path `sockaddr_un` caps at 103 characters. Under `run/`
# rather than beside the data directory, because `run/` is near the top of the home.
unix_socket_directories = '{{ paths.socket | replace('\\', '/') }}'
{%- else %}

# There are no Unix sockets here. Stated empty rather than left out, so a Windows configuration is
# this same file with one line different rather than a second template.
unix_socket_directories = ''
{%- endif %}

shared_buffers = {{ settings.shared_buffers }}
max_connections = {{ settings.max_connections }}

# Everything to stderr, which is the pipe the supervisor is reading. `logging_collector = on` would
# start a background process that writes into `log/` inside the *data* directory instead, and a
# supervisor reading the server's own streams would find an empty file and conclude the server said
# nothing. It said plenty.
logging_collector = off
log_destination = 'stderr'

{{ extra }}
