schema = 1

[blueprint]
name = "WordPress"
description = "WordPress on PHP-FPM with MariaDB — unpack WordPress into the project root"
created_at = "2026-09-01T00:00:00Z"

[blueprint.created_on]
os = "any"
version = "0.1.0"

[runtimes]
php = "8.4"

[site]
kind = "php-fpm"
doc_root = ""
https = true
domain_pattern = "{project}.test"

[[services]]
name = "mariadb"
instance = "main"
database = "{project}"
user = "{project}"
