[package]
name = "mixengine-cli"
description = "The mix binary: a thin client mapping 1:1 onto the daemon API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mix"
path = "src/main.rs"

[dependencies]
clap.workspace = true
http-body-util.workspace = true
# The client half of the same HTTP the daemon serves. `client::conn::http1::handshake` takes the
# byte stream `mixengine_platform::ipc` already hands back, where a pooled client would want a URL
# and a connector for a transport that has neither a host nor a port.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
# The transport and the OS convention for where the home is, and nothing else from that crate — see
# the note on this edge in `mixengine-proto/tests/workspace_layering.rs`.
mixengine-platform = { workspace = true, features = ["default"] }
mixengine-proto.workspace = true
# The QR code `mix site share` prints — T74. The daemon answers a URL; this is what turns that one
# string into something a phone camera reads, and nothing else in this binary needs it.
qrcode.workspace = true
# Two trait names as bounds and nothing else: one function here calls a method and decodes whatever
# that method answers with, and another serialises whatever it was given. Both have to spell the
# trait, and `serde_json` does not re-export it.
serde.workspace = true
serde_json.workspace = true
# `current_thread` and nothing more. A client sends one request and exits, so the multi-thread
# runtime the daemon needs would be several worker threads started to wait on a single socket. The
# reactor and the timer this leaves out are pulled in by `mixengine-platform`, which is where the
# connecting happens.
tokio = { workspace = true, features = ["macros", "rt"] }

[dev-dependencies]
tempfile.workspace = true
# The runtime tests drive a blocking `mix` while `MockRegistry` is serving the daemon that `mix` is
# talking to, so the two cannot share one thread. `rt-multi-thread` is a dev-dependency feature and
# reaches no shipped binary: `mix` itself is still `current_thread`, for the reason above.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The temporary home these tests run against, and the way they stop a daemon `mix` autostarted and
# nobody is holding. A dev-dependency and only ever that — enforced by
# `mixengine-proto/tests/workspace_layering.rs`.
mixengine-testkit.workspace = true
# Reading back the diagnostics archive `mix doctor --bundle` produces — roadmap task T93. A test
# that asserted the answer's JSON and never opened the file would be a test of the answer.
zip.workspace = true

[lints]
workspace = true
