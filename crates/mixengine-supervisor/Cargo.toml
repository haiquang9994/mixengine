[package]
name = "mixengine-supervisor"
description = "Process supervision: spawn, watch, restart, health-check and log capture for a ServiceSpec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The request body of a check that has none. One type, `Empty`, which hyper needs because a body is
# part of a request whether or not there is one.
http-body-util.workspace = true
# The HTTP checks (roadmap task T15a). `hyper` rather than `reqwest`, which
# ../standards/rust.md names for downloads: this crate asks a **loopback** URL for a status code —
# Caddy's admin endpoint, php-fpm's status page — so there is no TLS, no redirect and no cookie jar
# to want, and `hyper` is already in this tree for the IPC transport. A second HTTP stack and a
# second TLS stack for a `GET /config/` would be paid for by every build and every audit.
# `client` + `http1` are the whole of what is used: a connection over a socket we opened.
hyper = { workspace = true, features = ["client", "http1"] }
# `TokioIo`, the shim between a `TcpStream` and hyper's own IO traits. The daemon takes the same
# feature of the same crate for the server side.
hyper-util = { workspace = true, features = ["tokio"] }
mixengine-platform = { workspace = true, features = ["default"] }
mixengine-proto.workspace = true
regex.workspace = true
# The idle counter probe reads one number out of a status document (T69). Already in this tree for
# every `*_json` column; a hand-written parser for one field would be a second JSON reader to audit.
serde_json.workspace = true
thiserror.workspace = true
# `broadcast`, which is how a line reaches a ready check and, at T16, the daemon's event stream. The
# reader threads are the standard library's, not tokio's: an anonymous pipe on Windows cannot be read
# asynchronously at all — see `logs.rs`. `net` and `time` are the ready checks: a TCP connect, the
# retry between two of them and the deadline over all of them.
tokio = { workspace = true, features = ["io-util", "macros", "net", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
mixengine-testkit.workspace = true
tempfile.workspace = true
# `io-util` is the fake HTTP server the two `Http` checks are tested against: a socket that answers
# `503` twice and then `200` needs a read and a write, and nothing more of a server than that.
tokio = { workspace = true, features = ["io-util", "macros", "rt", "time"] }

[lints]
workspace = true
