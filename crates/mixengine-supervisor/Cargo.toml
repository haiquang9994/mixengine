[package]
name = "mixengine-supervisor"
description = "Process supervision: spawn, watch, restart, health-check and log capture for a ServiceSpec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mixengine-platform.workspace = true
mixengine-proto.workspace = true
regex.workspace = true
thiserror.workspace = true
# `broadcast`, which is how a line reaches a ready check and, at T16, the daemon's event stream. The
# reader threads are the standard library's, not tokio's: an anonymous pipe on Windows cannot be read
# asynchronously at all — see `logs.rs`. `net` and `time` are the ready checks: a TCP connect, the
# retry between two of them and the deadline over all of them.
tokio = { workspace = true, features = ["macros", "net", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
mixengine-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
