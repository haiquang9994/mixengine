[package]
name = "mixengine-platform"
description = "OS abstraction traits (hosts file, trust store, resolver, elevation, limits) plus per-OS and mock implementations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
directories = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
# `ElevationOutcome`. The first time this crate takes the edge the layering table in
# `crates/mixengine-proto/tests/workspace_layering.rs` has always allowed and nothing has ever used
# — see the T40a design, D8. Optional and enabled by `host`: `mixengine-elevate` compiles this crate
# with `elevated` alone, and its dependency closure is a security decision CI diffs against
# `.github/elevate-dependencies.txt`.
mixengine-proto = { workspace = true, optional = true }
thiserror.workspace = true
# Optional, and every feature that needs it names the parts of it that it needs — see `[features]`
# below. A build that takes only `elevated` compiles no tokio at all, which is the point.
tokio = { workspace = true, optional = true }
# One line per elevation attempt. The helper's exit code is deliberately not part of the trait's
# vocabulary (T40a, D7) — two systems hand one back cheaply and the third does not — so a log line is
# the only place it is ever written down, for a person diagnosing a run that left no report. Behind
# `host` for the same reason as `mixengine-proto` above.
tracing = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# **`keyring`'s own backend, named here so its error type can be reached.** The one crate in this
# workspace taken as a direct edge onto another crate's implementation, argued in ADR 0013: a
# machine with no secret service and a keyring that is merely locked arrive as the same `keyring`
# error, and the only thing that tells them apart is the D-Bus error name inside the boxed source.
# Optional and enabled by `host` for keyring's own reason — `mixengine-elevate` compiles this crate
# with `elevated` alone and must not grow a D-Bus dependency. No features of its own: `keyring`
# below names the ones this build needs, and Cargo unifies them onto this same package.
dbus-secret-service = { workspace = true, optional = true }
# The D-Bus secret service — gnome-keyring, kwallet — which is what "the keyring" means on Linux.
# `sync-secret-service` rather than its async sibling: the async backend drives an executor of its
# own from inside a synchronous call, which panics when that call comes from a runtime worker thread,
# and every caller here is a daemon that has one. `crypto-rust` encrypts the session without an
# OpenSSL build, and `vendored` compiles libdbus in rather than requiring `libdbus-1-dev` on the
# machine that builds a release.
keyring = { workspace = true, optional = true, features = [
    "sync-secret-service",
    "crypto-rust",
    "vendored",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The login Keychain, through Security.framework rather than by shelling out to `security`.
keyring = { workspace = true, optional = true, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
# The Credential Manager, through the API rather than through `cmdkey`.
keyring = { workspace = true, optional = true, features = ["windows-native"] }
# The named pipe's DACL and the peer check. `Win32_Security_Authorization` is the one that keeps
# this small: a security descriptor is built from an SDDL string in a single call rather than by
# hand-computing ACL sizes behind raw pointers.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    # The listening TCP table, which carries the owning pid of every listener and is the
    # whole of T38 on this system. `Win32_Networking_WinSock` comes with it, for the two
    # address families that table is asked for by name.
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    # `FILE_SHARE_READ` for the single-instance lock, whose whole mechanism is the share mode it
    # refuses to grant a second daemon.
    "Win32_Storage_FileSystem",
    # `GetStdHandle`, so a detached child does not inherit a pipe its caller is reading.
    "Win32_System_Console",
    # `CoInitializeEx`, which `ShellExecuteExW` documents as a precondition on the calling thread —
    # and its matching `CoUninitialize`, which must not run on a thread that was already in an
    # apartment of another kind. See `windows/prompt.rs`.
    "Win32_System_Com",
    # This user's `Path`, which Windows keeps in `HKCU\Environment` rather than anywhere a file
    # could be edited. `setx` would write it too and would truncate it at 1024 characters, which is
    # the whole argument for reaching the API here — see `windows/path.rs`.
    "Win32_System_Registry",
    # The other kind of child: a job object with `KILL_ON_JOB_CLOSE`, which is how this system
    # guarantees a supervised process cannot outlive the daemon (roadmap task T13).
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    # The names T34a's restricted token is spelled with: `SE_GROUP_ENABLED`, and the two
    # `DOMAIN_ALIAS_RID_*` the token drops. Constants rather than magic numbers, because a reader
    # checking this against `restricted_token.c` should be reading the same words.
    # Restarting the DNS Client after an NRPT rule is written straight to the registry (T45). The
    # cmdlet notifies the service through its WMI provider; a registry write does not, and CI
    # measured that the rule then routes nothing until the service reads it again.
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    # `WM_SETTINGCHANGE`, broadcast after the value above is written so that a shell started from
    # Explorer afterwards picks it up without a logout.
    # `ShellExecuteExW` and the `runas` verb: the whole of the Windows launcher (T40a). Features on
    # this crate add modules, not crates, so the helper's dependency budget does not move.
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# T49a: the certificates `trust::check` must refuse are generated the way T48 generates the real
# one, so every refusal is a refusal of something a certificate library actually produced rather
# than of hand-edited bytes.
rcgen.workspace = true
# The system suite writes a real request document and reads the report back (T40a). A dev-dependency
# only, so it never enters a shipped binary and never reaches the helper's audited closure.
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "rt-multi-thread",
    "time",
] }
# And `trust::der`, hand-written because `x509-parser` is 22 net crates into a binary that runs as
# root, is cross-checked against that parser here. **Dev only, and that is the whole of the T49a
# design's D11**: a reader that quietly disagreed with a real parser is the failure mode this
# arrangement exists to catch, and neither half can catch it alone.
x509-parser.workspace = true

# `default` enables everything, which is what keeps this from being a workspace-wide edit: not one
# existing dependent changes a line. The one build that takes something smaller is
# `mixengine-elevate`, which runs as root and whose dependency closure is a security decision — see
# the T40 design, D8, and `.github/elevate-dependencies.txt`, which CI diffs against.
#
# **Cargo unifies features across a workspace build.** `cargo build --workspace` still compiles this
# crate with tokio and keyring and links the helper against that. The lean tree is a property of
# building the helper *on its own*, which is why the release pipeline gives it an invocation of its
# own and why the check in `lint` runs `cargo tree -p mixengine-elevate --no-default-features`.
[features]
default = ["host", "ipc", "process", "signal", "elevated"]

# The `Host` trait and the five capabilities it hands out: home directories, directory permissions,
# the OS keyring, PATH integration, port ownership — plus `mock` and `generate_secret`. One feature
# rather than five, because `Host` is a single trait and splitting it would put `#[cfg]` inside a
# trait definition.
host = [
    # Declared per target, exactly as `keyring` below is, so naming it here activates it on Linux
    # and is a no-op on the other two.
    "dep:dbus-secret-service",
    "dep:directories",
    "dep:getrandom",
    "dep:keyring",
    "dep:mixengine-proto",
    "dep:tracing",
]

# The local endpoint: a Unix socket on one family and a named pipe on the other, both tokio types.
# `AsyncRead`/`AsyncWrite`, which the connection implements so the daemon can serve HTTP over it, are
# part of tokio's core. `io-util` is the extension traits that give them methods, and `time` is the
# accept loop's backoff after a transient error.
ipc = ["dep:tokio", "tokio/io-util", "tokio/net", "tokio/time"]

# `run_once`, and the async child rather than the standard library's for one reason: a probe with a
# deadline has to be able to give up, and a blocking `wait` cannot be — a `timeout` around one would
# leave the caller stuck on the very program that proved it will not finish. `time` is that deadline.
# `io-util` is `read_to_end`, which drains a one-shot's two pipes. `rt` is `spawn_blocking`, which
# `windows/process.rs` waits a handle on — a blocking wait that must not be on a runtime worker. It
# was never named here before because a workspace build unified it in from the daemon; a build of
# this crate on its own failed with "cannot find `spawn_blocking` in `tokio::task`".
process = ["dep:tokio", "tokio/io-util", "tokio/process", "tokio/rt", "tokio/time"]

# Two `SignalKind`s on Unix and five console control events on Windows, none of which has a std
# equivalent. `macros` is the `select!` in `unix/signal.rs`, which waits on SIGINT and SIGTERM at
# once.
signal = ["dep:tokio", "tokio/macros", "tokio/signal"]

# The primitives that only mean anything under an administrative token, and the only feature
# `mixengine-elevate` asks for. `mixengine-proto` is the one dependency, and it adds **no crate** to
# that binary's closure: the helper already depends on it directly, and `HostEntry` is the type the
# hosts engine is written against. `libc` and `windows-sys` are already required for `lock` and
# `paths`, and neither is optional.
elevated = ["dep:mixengine-proto"]

# `unsafe_code` is denied workspace-wide. This is the only crate that may lift the ban, and it does so
# per item with `#[expect(unsafe_code, reason = "…")]` — never crate-wide. The accompanying `# Safety`
# section is not a convention anyone has to remember: `clippy::missing_safety_doc` refuses to compile
# an unsafe item without one.
[lints]
workspace = true
