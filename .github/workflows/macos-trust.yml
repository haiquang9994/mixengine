# The macOS trust store, on its own, because T49c is a macOS question and nothing else.
#
# `ci.yml` runs ten jobs across three operating systems and the macOS `system` leg is the last of
# them to finish. Asking a question of `security` through that costs ten minutes a guess, and T49c
# is a question with more than one guess left in it. This workflow is the macOS leg alone, started
# by hand, and its default mode compiles nothing at all.
#
# **Temporary.** It exists for as long as T49c is open. When the removal has a mechanism this file
# goes, and what it proved is written into the T49a design and the roadmap where the next person
# will find it.
name: macos-trust

# **Started by editing it**, which is not a workaround so much as the shape of the thing:
# `workflow_dispatch` only resolves for a workflow that already exists on the default branch, and
# this one is deliberately not there yet. A path filter fits what it is for anyway — every run of it
# so far has followed a change to the question it asks — and `gh run rerun` covers asking the same
# question twice.
on:
  push:
    paths:
      - ".github/workflows/macos-trust.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "Also build and run the elevated trust round trip (slow; the probe alone needs no toolchain)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  probe:
    name: what security answers
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `security remove-trusted-cert -d` does not return from inside the helper. More than one
      # explanation survives and each round of guessing costs a run, so this asks all of them at
      # once, against a throwaway certificate of its own.
      #
      # Every command gets its own alarm, so one that hangs spends its twenty seconds and no more,
      # and each exit status is printed rather than inferred from whether the step went red.
      #
      # The first case is the discriminator nothing else can be read without: if a plain
      # `sudo security remove-trusted-cert -d` answers *here*, the fault is not the command but
      # something about how the helper runs it — its environment, its standard input, or its being
      # a grandchild — and the whole search moves.
      - name: Whether a delete is targeted, and what identifies the certificate it deletes
        run: |
          cd "$RUNNER_TEMP"

          # `alarm` survives `exec`, so the limit lands on the command itself. `|| code=$?` because
          # this step's shell is `bash -e` and a killed command would otherwise end the run at its
          # first question — which it did, once.
          bounded() {
            local label="$1"; shift
            echo "--- $label: $* ---"
            local code=0
            perl -e 'alarm 20; exec @ARGV' "$@" </dev/null || code=$?
            echo "    exit $code"
          }

          settings() {
            echo "=== admin trust settings after $1 ==="
            local code=0
            perl -e 'alarm 20; exec @ARGV' sudo security dump-trust-settings -d </dev/null || code=$?
            echo "    exit $code"
          }

          # **Two certificates, and that is the whole point of this run.** The previous probe found
          # that `security delete-certificate` leaves no admin trust setting behind — but it ran
          # against a domain holding exactly one certificate, where "deleted the right entry" and
          # "wiped the domain" produce identical output. A removal that took somebody else's
          # corporate root out with ours would be the worst defect in this task, and one
          # certificate could never have detected it.
          for name in Alpha Beta; do
            openssl req -x509 -newkey rsa:2048 -nodes -keyout "key-$name.pem" \
              -out "$name.pem" -days 30 -subj "/CN=MixEngine T49c $name" 2>/dev/null
            bounded "install $name" sudo security add-trusted-cert -d -r trustRoot \
              -k /Library/Keychains/System.keychain "$name.pem"
          done
          settings "both installs"

          # What `-Z` prints beside each certificate, and in what shape. If the hash the system
          # itself reports can be read back, a removal can name the *exact certificate* it means
          # rather than a common name — which is the check `windows::store::remove` performs against
          # every certificate it walks, and the one a name match would give up.
          echo "--- what find-certificate -a -Z -p prints (first 40 lines) ---"
          security find-certificate -a -Z -p -c "MixEngine T49c" \
            /Library/Keychains/System.keychain | head -40

          alpha=$(security find-certificate -Z -c "MixEngine T49c Alpha" \
            /Library/Keychains/System.keychain | awk '/SHA-1 hash/ { print $NF }')
          echo "    Alpha SHA-1 as the system reports it: '$alpha'"

          # Delete by that hash: exact, and nothing about it comes from a name.
          bounded "delete Alpha by -Z" sudo security delete-certificate -Z "$alpha" \
            /Library/Keychains/System.keychain

          bounded "Alpha still there?" security find-certificate -c "MixEngine T49c Alpha" \
            /Library/Keychains/System.keychain
          bounded "Beta still there?" security find-certificate -c "MixEngine T49c Beta" \
            /Library/Keychains/System.keychain
          settings "deleting Alpha"

          # And the same by name, for comparison: the two ways differ in what they trust to identify
          # a certificate, and both have to be measured before one is chosen.
          bounded "delete Beta by -c" sudo security delete-certificate -c "MixEngine T49c Beta" \
            /Library/Keychains/System.keychain
          bounded "Beta still there?" security find-certificate -c "MixEngine T49c Beta" \
            /Library/Keychains/System.keychain
          settings "deleting Beta"

      # The same shape as `ci.yml`'s `system` job: built as the ordinary user, run as root. Only
      # when asked for, because it is the toolchain and the compile that make this workflow slow and
      # the probe above needs neither.
      - name: Install pinned toolchain
        if: inputs.suite
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        if: inputs.suite
        with:
          key: macos-trust

      - name: Build the trust round trip
        if: inputs.suite
        run: cargo test -p mixengine-elevate --test system --locked --no-run

      - name: The trust round trip, as root
        if: inputs.suite
        run: |
          set -euo pipefail
          suite=$(cargo test -p mixengine-elevate --test system --locked --no-run \
            --message-format=json | jq -r 'select(.profile.test == true) | .executable' | tail -n 1)
          echo "running $suite as root"
          sudo -E "$suite" --ignored --nocapture --test-threads=1 trust_store

      - name: What this run left in the trust store
        if: always()
        run: |
          bounded() { perl -e 'alarm 20; exec @ARGV' "$@" </dev/null; }
          echo "--- certificates ---"
          bounded security find-certificate -a -c "MixEngine" /Library/Keychains/System.keychain \
            || echo "nothing of ours, or the read did not answer"
          echo "--- admin trust settings ---"
          bounded sudo security dump-trust-settings -d \
            || echo "no admin trust settings, or the read did not answer"
