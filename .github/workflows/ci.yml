# The three jobs described in .claude/operations/build-and-release.md as `lint`, `test` and `bench`.
# The remaining jobs from that table (`system`, `bindings`, `build`) arrive with the work that gives
# them something to run: the first `#[ignore]`d system tests, T56 and T85 respectively. T11 landed
# the fixture crate the `test` job below already builds and runs, but it produced no `#[ignore]`d
# test — nothing in the suite yet needs an elevated runner — so `system` still has nothing to run and
# would be a green job that proves nothing.
name: CI

# One ref fires on its own, and only one. The `test` job is the only thing in this repository that
# compiles the workspace for all three operating systems, and two thirds of `mixengine-platform` is
# behind a `#[path]` that a developer machine never builds — so a change that breaks Linux or macOS
# is invisible until something compiles it there. That answer is wanted while the work is still in
# progress, not after it lands; but firing on every branch bought it by spending a runner on every
# push, including the dozen that are just a work-in-progress save.
#
# So the automatic trigger is `master` alone: the merge itself is a state no feature branch ever
# compiled, and it is the one ref whose result nobody has to remember to ask for. Every other branch
# asks for itself. Push the branch under its own name, then request a run on it:
#
#     git push origin HEAD
#     gh workflow run ci.yml --ref "$(git branch --show-current)"
#
# The run is then labelled with the branch that asked, so two questions in flight are told apart by
# their ref instead of overwriting each other on one shared lane — and nothing has to be force-pushed
# to a scratch branch to ask one. `workflow_dispatch` re-runs `master` from the UI the same way.
#
# The dispatch list is read from the default branch: a workflow file only becomes requestable once
# this file is on `master`, and a branch that edits it runs its own version once selected.
#
# Pull requests are not a trigger. A pull request's head is a branch you can request a run on like
# any other, and leaving `pull_request` on would mean the same commit builds twice.
on:
  push:
    branches: [master]
  workflow_dispatch:

# A new push, or a second request on the same branch, makes the previous run pointless. Runs on
# master are kept so the branch always has a complete result history; a feature branch's run is
# cancelled and replaced, because asking again means the answer in flight is about a commit you have
# already moved past, and waiting it out delays the one you now want.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # CI builds are never incremental: it only costs cache size and hurts a cold runner.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    # Generous, but far short of the six-hour default: a job that hangs should free the runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No toolchain action: rust-toolchain.toml is the single source of truth for the version and
      # for the clippy/rustfmt components. Given no argument, `rustup toolchain install` installs
      # exactly what that file pins — note that `rustup show` stopped installing anything in 1.28.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # D8 of the T40 design. `mixengine-elevate` runs as root, and its whole dependency closure is a
      # security decision — its own manifest says so. Cargo unifies features across a workspace build,
      # so `cargo build --workspace` compiles `mixengine-platform` with tokio and keyring and links
      # the helper against that; the lean tree is a property of building the helper **on its own**,
      # which is what both of these steps do and what the release pipeline does.
      #
      # A change here is not a lint failure to be waved through: read the diff, and if the new
      # dependency belongs in a binary that runs as root, commit the updated list in the same change.
      - name: The elevated helper builds without the rest of the platform
        run: cargo check -p mixengine-elevate --locked

      - name: The elevated helper's dependency budget
        run: |
          set -euo pipefail
          cargo tree -p mixengine-elevate --no-default-features --edges normal             --prefix none --format '{p}' | sed 's/ v[0-9].*//' | sort -u > /tmp/elevate-dependencies.txt
          grep -v '^#' .github/elevate-dependencies.txt | diff -u - /tmp/elevate-dependencies.txt

      # `sqlx::query!` checks its SQL against a real database at compile time. Nobody building
      # MixEngine has one — so the answers are committed as `.sqlx/`, and every other build reads
      # those instead of connecting (T14). The failure this step exists for is a query edited
      # without re-running `prepare`: the author's machine still builds, because DATABASE_URL is set
      # there, and everyone else's stops. `--check` regenerates the answers and fails if they differ
      # from what is committed.
      #
      # Prebuilt binary rather than `cargo install sqlx-cli`, which is a four-minute compile of a
      # tool this job uses for six seconds.
      #
      # Pinned to the `sqlx` version in Cargo.lock, and it has to stay in step with it: the contents
      # of `.sqlx/` are a version-specific format, so an unpinned CLI would start regenerating them
      # differently the day sqlx releases and fail `--check` on whichever unrelated PR ran next.
      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli@0.9.0

      - name: sqlx offline data is current
        env:
          DATABASE_URL: sqlite:target/sqlx-ci.db
        run: |
          cargo sqlx database create
          cargo sqlx migrate run --source crates/mixengine-core/migrations
          cargo sqlx prepare --workspace --check -- --all-targets --all-features

      # rustdoc runs in the `test` job instead, once per runner — see the note there. It has to be
      # built on the OS it documents, and this job only has one.
      #
      # Licences and advisories. Configuration lives in deny.toml, including the six release targets.
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # `check` alone would also run `sources`, which is fine, but being explicit means a new
          # check category added upstream cannot silently start failing our builds.
          arguments: --all-features
          command-arguments: advisories bans licenses sources

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One OS failing must not hide the result on the other two — the platform layer is exactly
      # where per-OS divergence shows up.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # T2b, answered: this leg holds `BUILTIN\Administrators` as an *enabled* group at High
      # Mandatory Level — a full token, not the UAC-filtered one where that group is present
      # deny-only and grants nothing. The account name in the cache paths, `runneradmin`, never
      # settled that; only `/groups` does.
      #
      # It stays as an assertion rather than being deleted with the question, because
      # standards/testing.md now states the answer and derives a rule from it — write Windows
      # exclusion tests structurally, never by attempting an access this token would win — and a
      # runner image that quietly de-escalated would leave that page confidently wrong. Failing on
      # the good news is the point: the news is only good once somebody acts on it.
      - name: What this leg runs as (T2b)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $groups = whoami /groups
          $groups
          $admin = $groups | Select-String -SimpleMatch 'S-1-5-32-544'
          if (-not ($admin -and "$admin" -match 'Enabled group')) {
            Write-Host '::error::This leg is no longer an elevated administrator, which is good news and not a build failure. Re-read the Privilege section of .claude/standards/testing.md, which concluded the opposite, and delete this step with it.'
            exit 1
          }

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      # Everything the build needs is downloaded here, while the network is still allowed. From this
      # point on cargo runs offline, so a dependency that is not in Cargo.lock fails the job instead
      # of being fetched silently.
      - name: Fetch dependencies
        run: cargo fetch --locked

      # The one thing in this job that is downloaded rather than built, and the reason it is worth
      # it: `crates/mixengine-cli/tests/caddy.rs` is the only test in the workspace that judges a
      # recipe against the program it configures. Everything else about T31 is provable in one
      # process; that Caddy *accepts what MixEngine generates* is not, and a template with a Windows
      # path in it is exactly the kind of thing that is fine on two systems and broken on the third.
      #
      # From our own signed index's release rather than from upstream, pinned, so this leg installs
      # the same artifact a user would. It is a **test fixture and not an install**: nothing here
      # checks a signature or a hash, because the code that does is `core::index` and `core::install`
      # and both have their own suites. What would break if the download were wrong is this test,
      # loudly.
      #
      # Before the offline steps below, because from there on there is no network — and on Linux no
      # route out at all.
      - name: Fetch a real Caddy
        env:
          CADDY: "2.11.4"
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)     target=linux-x86_64;    ext=tar.zst ;;
            Linux-ARM64)   target=linux-aarch64;   ext=tar.zst ;;
            macOS-ARM64)   target=macos-aarch64;   ext=tar.zst ;;
            macOS-X64)     target=macos-x86_64;    ext=tar.zst ;;
            Windows-X64)   target=windows-x86_64;  ext=zip ;;
            Windows-ARM64) target=windows-aarch64; ext=zip ;;
            *) echo "::error::mixengine-packages publishes no Caddy for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac

          into="$RUNNER_TEMP/caddy"
          archive="$RUNNER_TEMP/caddy.$ext"
          mkdir -p "$into"

          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/haiquang9994/mixengine-packages/releases/download/caddy-$CADDY/caddy-$CADDY-$target.$ext"

          # Two different `tar`s, and on Windows the one on the PATH is the wrong one. Git Bash
          # ships GNU tar, which reads `D:\a\_temp\caddy.zip` as a *remote host* called `D` — and
          # cannot read a zip even once told otherwise. Windows itself ships bsdtar, which reads
          # both, so it is named outright rather than reached through the PATH.
          #
          # Elsewhere the archive is `.tar.zst`: bsdtar decompresses it by magic and GNU tar shells
          # out to `zstd`, so the pipe is the fallback for a tar built without it.
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$SYSTEMROOT/System32/tar.exe" -xf "$archive" -C "$into"
          else
            tar -xf "$archive" -C "$into" || zstd -dc "$archive" | tar -xf - -C "$into"
          fi

          echo "MIXENGINE_CADDY_PACKAGE=$into" >> "$GITHUB_ENV"
          "$into/caddy$( [ "$RUNNER_OS" = "Windows" ] && echo .exe )" version

      # **And the other front end — T37.** The same reasoning as the Caddy step, plus one thing only
      # this program can settle: an `include` inside an nginx configuration resolves against the
      # *prefix* rather than against the file, so whether `include sites/*.conf` is judged in the
      # staging directory — which is what makes a broken rendering refused before it is installed —
      # is a question about nginx's own path handling and about nothing MixEngine can assert.
      #
      # **The whole tree, not the binary.** A generated `nginx.conf` includes the archive's own
      # `conf/mime.types` by absolute path, so the fixture packs what was unpacked here.
      - name: Fetch a real nginx
        shell: bash
        env:
          NGINX: "1.31.3"
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)     target=linux-x86_64;    ext=tar.zst ;;
            Linux-ARM64)   target=linux-aarch64;   ext=tar.zst ;;
            macOS-ARM64)   target=macos-aarch64;   ext=tar.zst ;;
            macOS-X64)     target=macos-x86_64;    ext=tar.zst ;;
            Windows-X64)   target=windows-x86_64;  ext=zip ;;
            Windows-ARM64)
              echo "::notice::nginx.org publishes one Windows build and it is 32-bit x86, so this cell is empty on purpose"
              exit 0 ;;
            *) echo "::error::mixengine-packages publishes no nginx for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac

          into="$RUNNER_TEMP/nginx"
          archive="$RUNNER_TEMP/nginx.$ext"
          mkdir -p "$into"

          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/haiquang9994/mixengine-packages/releases/download/nginx-$NGINX/nginx-$NGINX-$target.$ext"

          # The same two `tar`s for the same reason as the Caddy step above.
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$SYSTEMROOT/System32/tar.exe" -xf "$archive" -C "$into"
          else
            tar -xf "$archive" -C "$into" || zstd -dc "$archive" | tar -xf - -C "$into"
          fi

          echo "MIXENGINE_NGINX_PACKAGE=$into" >> "$GITHUB_ENV"
          # `-v` and not `-t`: the second reads a configuration, and there is none here. It is also
          # what the recipe's smoke test runs, so a build that fails this fails an install too.
          "$into/nginx$( [ "$RUNNER_OS" = "Windows" ] && echo .exe )" -v

      # **A second real program, and it buys what the Caddy one cannot.** Caddy is one binary that
      # behaves the same on all three systems; PHP is the opposite, and T32 is the task about that:
      # a Unix artifact publishes `php-fpm` and a Windows one publishes `php-cgi`, which are
      # different SAPIs configured by different mechanisms — a file on one, an environment on the
      # other. A recipe that renders correctly on both is not a recipe that runs on both, and only
      # the program can tell the two apart.
      - name: Fetch a real PHP
        env:
          PHP: "8.3.33"
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)     target=linux-x86_64;    ext=tar.zst ;;
            Linux-ARM64)   target=linux-aarch64;   ext=tar.zst ;;
            macOS-ARM64)   target=macos-aarch64;   ext=tar.zst ;;
            macOS-X64)     target=macos-x86_64;    ext=tar.zst ;;
            Windows-X64)   target=windows-x86_64;  ext=zip ;;
            Windows-ARM64) target=windows-aarch64; ext=zip ;;
            *) echo "::error::mixengine-packages publishes no PHP for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac

          into="$RUNNER_TEMP/php"
          archive="$RUNNER_TEMP/php.$ext"
          mkdir -p "$into"

          curl --fail --silent --show-error --location --retry 3 --output "$archive"             "https://github.com/haiquang9994/mixengine-packages/releases/download/php-$PHP/php-$PHP-$target.$ext"

          # The same two `tar`s for the same reason as the Caddy step above.
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$SYSTEMROOT/System32/tar.exe" -xf "$archive" -C "$into"
          else
            tar -xf "$archive" -C "$into" || zstd -dc "$archive" | tar -xf - -C "$into"
          fi

          echo "MIXENGINE_PHP_RUNTIME=$into" >> "$GITHUB_ENV"
          # `bin/php` on Unix, `php.exe` at the root on Windows — the layout is the publisher's, and
          # the suite probes for it rather than writing it down. This is only the smoke check.
          "$into/bin/php$( [ "$RUNNER_OS" = "Windows" ] && echo .exe )" --version ||             "$into/php$( [ "$RUNNER_OS" = "Windows" ] && echo .exe )" --version

      # And a real MariaDB, for T33 — the first recipe that has to *create* something before it can
      # run at all, and the one whose every platform difference is upstream's rather than ours: two
      # different `mariadb-install-db` programs, a bootstrap that refuses `SET PASSWORD`, and an
      # option parser that reads a backslash as an escape.
      #
      # **A cost worth stating.** MariaDB is much larger than Caddy or PHP, and this adds a download
      # plus a real bootstrap to every `test` job on every runner. If it pushes CI past what is
      # tolerable, the answer is a separate job rather than a quieter test.
      - name: Fetch a real MariaDB
        env:
          MARIADB: "11.4.12"
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)     target=linux-x86_64;    ext=tar.zst ;;
            Linux-ARM64)   target=linux-aarch64;   ext=tar.zst ;;
            macOS-ARM64)   target=macos-aarch64;   ext=tar.zst ;;
            macOS-X64)     target=macos-x86_64;    ext=tar.zst ;;
            Windows-X64)   target=windows-x86_64;  ext=zip ;;
            Windows-ARM64) target=windows-aarch64; ext=zip ;;
            *) echo "::error::mixengine-packages publishes no MariaDB for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac

          into="$RUNNER_TEMP/mariadb"
          archive="$RUNNER_TEMP/mariadb.$ext"
          mkdir -p "$into"

          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/haiquang9994/mixengine-packages/releases/download/mariadb-$MARIADB/mariadb-$MARIADB-$target.$ext"

          # The same two `tar`s for the same reason as the Caddy step above.
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$SYSTEMROOT/System32/tar.exe" -xf "$archive" -C "$into"
          else
            tar -xf "$archive" -C "$into" || zstd -dc "$archive" | tar -xf - -C "$into"
          fi

          echo "MIXENGINE_MARIADB_PACKAGE=$into" >> "$GITHUB_ENV"
          # `bin/mariadbd` on every system — the layout is the publisher's, and the suite probes for
          # it rather than writing it down. This is only the smoke check.
          "$into/bin/mariadbd$( [ "$RUNNER_OS" = "Windows" ] && echo .exe )" --version

      # And a *second* MariaDB, of another series, for T36 — two instances of one server, at two
      # versions, running side by side. 10.6 is the oldest line the index publishes and is chosen
      # for what it does not share with 11.4: upstream renamed every program the bootstrap runs
      # between the two, and their `share/` layouts differ. Two instances of one version would
      # share a `packages` row and prove only that two directories can have two names.
      #
      # **The cost is a second download and a second bootstrap**, and it is why the suite that uses
      # it is its own step: if that becomes intolerable, the answer is a job of its own rather than
      # a suite that stops running two servers.
      - name: Fetch a second MariaDB, of an older series
        env:
          MARIADB_LEGACY: "10.6.28"
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)     target=linux-x86_64;    ext=tar.zst ;;
            Linux-ARM64)   target=linux-aarch64;   ext=tar.zst ;;
            macOS-ARM64)   target=macos-aarch64;   ext=tar.zst ;;
            macOS-X64)     target=macos-x86_64;    ext=tar.zst ;;
            Windows-X64)   target=windows-x86_64;  ext=zip ;;
            Windows-ARM64) target=windows-aarch64; ext=zip ;;
            *) echo "::error::mixengine-packages publishes no MariaDB for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac

          into="$RUNNER_TEMP/mariadb-legacy"
          archive="$RUNNER_TEMP/mariadb-legacy.$ext"
          mkdir -p "$into"

          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/haiquang9994/mixengine-packages/releases/download/mariadb-$MARIADB_LEGACY/mariadb-$MARIADB_LEGACY-$target.$ext"

          # The same two `tar`s for the same reason as the Caddy step above.
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$SYSTEMROOT/System32/tar.exe" -xf "$archive" -C "$into"
          else
            tar -xf "$archive" -C "$into" || zstd -dc "$archive" | tar -xf - -C "$into"
          fi

          echo "MIXENGINE_MARIADB_LEGACY_PACKAGE=$into" >> "$GITHUB_ENV"
          # This series ships `bin/mysqld` and a `bin/mariadbd` beside it; the suite probes for
          # every program it needs and this is only the smoke check.
          "$into/bin/mariadbd$( [ "$RUNNER_OS" = "Windows" ] && echo .exe )" --version

      # And a real MySQL, for T34c — the other database with these programs' names, and not a
      # version of the one above. 8.4 is the line `.claude/features/services.md` names; the two 5.x
      # lines take the other two bootstrap routes and are judged by `mixengine-packages`' own smoke
      # test on every published cell, which is where the artifacts that need them are made.
      #
      # **There is no Windows-on-ARM cell in any MySQL line** — upstream has never published one and
      # nothing here compiles Windows — so that leg fetches nothing and the test step below skips
      # itself rather than failing on a download that could not succeed.
      - name: Fetch a real MySQL
        shell: bash
        env:
          MYSQL: "8.4.10"
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)     target=linux-x86_64;    ext=tar.zst ;;
            Linux-ARM64)   target=linux-aarch64;   ext=tar.zst ;;
            macOS-ARM64)   target=macos-aarch64;   ext=tar.zst ;;
            macOS-X64)     target=macos-x86_64;    ext=tar.zst ;;
            Windows-X64)   target=windows-x86_64;  ext=zip ;;
            Windows-ARM64)
              echo "::notice::mixengine-packages publishes no MySQL for Windows on ARM, and neither does upstream"
              exit 0 ;;
            *) echo "::error::mixengine-packages publishes no MySQL for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac

          into="$RUNNER_TEMP/mysql"
          archive="$RUNNER_TEMP/mysql.$ext"
          mkdir -p "$into"

          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/haiquang9994/mixengine-packages/releases/download/mysql-$MYSQL/mysql-$MYSQL-$target.$ext"

          # The same two `tar`s for the same reason as the Caddy step above.
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$SYSTEMROOT/System32/tar.exe" -xf "$archive" -C "$into"
          else
            tar -xf "$archive" -C "$into" || zstd -dc "$archive" | tar -xf - -C "$into"
          fi

          echo "MIXENGINE_MYSQL_PACKAGE=$into" >> "$GITHUB_ENV"
          # `bin/mysqld` on every system this fetches. Only the smoke check; the suite probes.
          "$into/bin/mysqld$( [ "$RUNNER_OS" = "Windows" ] && echo .exe )" --version

      # And a real PostgreSQL, for T34 — the recipe that made T34a necessary. It is the smaller of
      # the two databases, and it is the one whose Windows leg only runs at all because a supervised
      # child is now created from a restricted token: `postgres` refuses the full token the step at
      # the top of this job asserts this runner holds.
      - name: Fetch a real PostgreSQL
        env:
          POSTGRES: "18.6"
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)     target=linux-x86_64;    ext=tar.zst ;;
            Linux-ARM64)   target=linux-aarch64;   ext=tar.zst ;;
            macOS-ARM64)   target=macos-aarch64;   ext=tar.zst ;;
            macOS-X64)     target=macos-x86_64;    ext=tar.zst ;;
            Windows-X64)   target=windows-x86_64;  ext=zip ;;
            # Upstream does not compile PostgreSQL there before 19, so the index offers nothing on
            # this cell and neither does this step. The suite below is skipped rather than failed.
            Windows-ARM64) echo "::notice::mixengine-packages publishes no PostgreSQL for Windows on ARM; the recipe suite is skipped on this leg"; exit 0 ;;
            *) echo "::error::mixengine-packages publishes no PostgreSQL for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac

          into="$RUNNER_TEMP/postgres"
          archive="$RUNNER_TEMP/postgres.$ext"
          mkdir -p "$into"

          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/haiquang9994/mixengine-packages/releases/download/postgres-$POSTGRES/postgres-$POSTGRES-$target.$ext"

          # The same two `tar`s for the same reason as the two steps above.
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$SYSTEMROOT/System32/tar.exe" -xf "$archive" -C "$into"
          else
            tar -xf "$archive" -C "$into" || zstd -dc "$archive" | tar -xf - -C "$into"
          fi

          echo "MIXENGINE_POSTGRES_PACKAGE=$into" >> "$GITHUB_ENV"
          # `bin/postgres` on every route — one spelling, which the Debian cell buys with a symlink.
          "$into/bin/postgres$( [ "$RUNNER_OS" = "Windows" ] && echo .exe )" --version

      # And the two caches, for T35. Small downloads next to the two databases above, and the pair
      # of them is one roadmap task because neither is big enough to be one on its own.
      - name: Fetch a real Redis
        env:
          REDIS: "8.10.0"
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)     target=linux-x86_64;    ext=tar.zst ;;
            Linux-ARM64)   target=linux-aarch64;   ext=tar.zst ;;
            macOS-ARM64)   target=macos-aarch64;   ext=tar.zst ;;
            macOS-X64)     target=macos-x86_64;    ext=tar.zst ;;
            Windows-X64)   target=windows-x86_64;  ext=zip ;;
            # Cygwin has no aarch64 port, so the Windows cells of both caches are built for x86_64
            # and that one alone — see mixengine-packages' `docs/packages/redis-memcached.md`.
            Windows-ARM64) echo "::notice::mixengine-packages publishes no Redis for Windows on ARM; the recipe suite is skipped on this leg"; exit 0 ;;
            *) echo "::error::mixengine-packages publishes no Redis for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac

          into="$RUNNER_TEMP/redis"
          archive="$RUNNER_TEMP/redis.$ext"
          mkdir -p "$into"

          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/haiquang9994/mixengine-packages/releases/download/redis-$REDIS/redis-$REDIS-$target.$ext"

          # The same two `tar`s for the same reason as the steps above.
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$SYSTEMROOT/System32/tar.exe" -xf "$archive" -C "$into"
          else
            tar -xf "$archive" -C "$into" || zstd -dc "$archive" | tar -xf - -C "$into"
          fi

          echo "MIXENGINE_REDIS_PACKAGE=$into" >> "$GITHUB_ENV"
          "$into/bin/redis-server$( [ "$RUNNER_OS" = "Windows" ] && echo .exe )" --version

      - name: Fetch a real memcached
        env:
          MEMCACHED: "1.6.45"
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)     target=linux-x86_64;    ext=tar.zst ;;
            Linux-ARM64)   target=linux-aarch64;   ext=tar.zst ;;
            macOS-ARM64)   target=macos-aarch64;   ext=tar.zst ;;
            macOS-X64)     target=macos-x86_64;    ext=tar.zst ;;
            Windows-X64)   target=windows-x86_64;  ext=zip ;;
            Windows-ARM64) echo "::notice::mixengine-packages publishes no memcached for Windows on ARM; the recipe suite is skipped on this leg"; exit 0 ;;
            *) echo "::error::mixengine-packages publishes no memcached for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac

          into="$RUNNER_TEMP/memcached"
          archive="$RUNNER_TEMP/memcached.$ext"
          mkdir -p "$into"

          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/haiquang9994/mixengine-packages/releases/download/memcached-$MEMCACHED/memcached-$MEMCACHED-$target.$ext"

          if [ "$RUNNER_OS" = "Windows" ]; then
            "$SYSTEMROOT/System32/tar.exe" -xf "$archive" -C "$into"
          else
            tar -xf "$archive" -C "$into" || zstd -dc "$archive" | tar -xf - -C "$into"
          fi

          echo "MIXENGINE_MEMCACHED_PACKAGE=$into" >> "$GITHUB_ENV"
          # `-V` and not `--version`: the short flag is in every line the index publishes.
          "$into/bin/memcached$( [ "$RUNNER_OS" = "Windows" ] && echo .exe )" -V

      - name: Build tests
        run: cargo test --workspace --all-targets --all-features --locked --offline --no-run

      # The keyring capability talks to a D-Bus secret service on Linux, and a runner has a session
      # bus with no provider on it — which the tests read as a store that is there and refusing,
      # because that is what it is. Installed as a job step rather than from the script: the suite
      # runs in a namespace with no route out, so nothing inside it can fetch a package. Starting
      # the daemon is the script's job, since it has to happen inside that namespace.
      #
      # Windows and macOS need no equivalent: their stores are part of the OS.
      #
      # **Bounded, because an unbounded one cost a whole run.** `apt-get` waits on a stalled mirror
      # for as long as the mirror likes: one run spent twenty-seven minutes inside `apt-get update`
      # and was killed by the job's own timeout, having proved nothing about anything. A per-request
      # deadline and three attempts is what a mirror having a bad minute deserves; a step timeout
      # well under the job's is what says *this* is what went wrong when it is having a bad hour.
      - name: Install a secret service
        if: runner.os == 'Linux'
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && break
            echo "::warning title=apt-get update failed::attempt $attempt of 3"
            sleep 5
          done

          sudo apt-get install -y --no-install-recommends gnome-keyring dbus

      # Linux is the leg that actually proves "no network in tests": the suite runs in a namespace
      # with nothing but loopback. The script runs the doc tests too, inside the same namespace.
      - name: Test (no network)
        if: runner.os == 'Linux'
        env:
          CARGO_NET_OFFLINE: "true"
        run: bash .github/scripts/test-no-network.sh

      # Windows and macOS have no equally cheap isolation primitive, so there the rule is carried by
      # the test harness (T11) plus the offline cargo above.
      # **`--no-fail-fast`, so a leg reports every failure it found rather than the first.** cargo
      # stops after the first failing test binary by default, which on a matrix means one answer per
      # round trip — and a round trip here is three operating systems and ten minutes. The suites
      # after the first are exactly the ones that say whether a failure is one test or all of them.
      - name: Test
        if: runner.os != 'Linux'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-targets --all-features --locked --offline --no-fail-fast

      # The suite that needs the archive above. `#[ignore]`d rather than skipped, so a system where
      # it does not run says so instead of reporting a pass — see the note at the top of
      # `crates/mixengine-cli/tests/caddy.rs`. The Linux runner did this inside the namespace
      # already; a Caddy on loopback does not need a route out.
      - name: Test against a real Caddy
        if: runner.os != 'Linux'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-cli --test caddy --locked --offline -- --ignored

      # And the other front end through the same arc — T37. Its own step rather than a second
      # `--test` on the line above, for the reason every suite below has one: a failure should name
      # which recipe failed without anybody reading the log. The two run the *same* sequence of
      # assertions from `tests/harness/frontend.rs`, which is what makes them a parity suite rather
      # than two files that resemble each other.
      #
      # The guard on the variable is what would make a Windows-on-ARM leg green: there is no nginx to
      # fetch there and no upstream that publishes one.
      - name: Test against a real nginx
        if: runner.os != 'Linux' && env.MIXENGINE_NGINX_PACKAGE != ''
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-cli --test nginx --locked --offline -- --ignored

      # And the one that needs the PHP. Its own step rather than a second `--test` on the line above,
      # because a failure should name which recipe failed without anybody reading the log.
      - name: Test against a real PHP
        if: runner.os != 'Linux'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-cli --test php_fpm --locked --offline -- --ignored

      # And the ini set that PHP reads — T28. Its own step for the reason the one above has: a
      # failure should name which half failed without anybody reading the log.
      - name: Test the generated PHP ini set
        if: runner.os != 'Linux'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-cli --test php_extensions --locked --offline -- --ignored

      # And the one that needs the MariaDB. Its own step for the reason the PHP one is: a failure
      # should name which recipe failed without anybody reading the log.
      #
      # The Linux leg runs this from inside `test-no-network.sh` rather than here, and the
      # difference is the credential store: the bootstrap refuses a machine without one **by
      # design**, and that script is where a `gnome-keyring` is started on a session bus of its own.
      #
      # **`--nocapture`, and a timeout of its own.** libtest holds a running test's output until the
      # test ends, so the first run of this suite on macOS reported twenty-seven minutes of silence
      # and then the job's own timeout. The suite says what it is doing as it goes; this is what
      # lets a reader see it, and the step timeout is what leaves the doc tests below enough of the
      # job to still run.
      - name: Test against a real MariaDB
        if: runner.os != 'Linux'
        timeout-minutes: 15
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-cli --test mariadb --locked --offline -- --ignored --nocapture

      # And the one that runs two of them at once — T36. Its own step rather than more of the one
      # above, because what it proves is a different claim and because it is the expensive half:
      # two installs, two bootstraps, two servers up together. Measured at fifty seconds on a
      # local Linux, against that suite's thirty-six.
      #
      # The Linux leg runs this from inside `test-no-network.sh`, for the reason MariaDB's own
      # suite does: two first-run rituals, two generated root passwords, and a credential store
      # that only exists inside that script's session bus.
      - name: Test two instances of one server, at two versions
        if: runner.os != 'Linux'
        timeout-minutes: 25
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-cli --test instances --locked --offline -- --ignored --nocapture

      # And the one that needs the PostgreSQL — T34. Its own step for the reason the three above
      # have one: a failure should name which recipe failed without anybody reading the log.
      #
      # The Linux leg runs this from inside `test-no-network.sh`, for MariaDB's reason: the ritual
      # puts the generated superuser password in the OS credential store and refuses a machine with
      # none, and that script is where a `gnome-keyring` runs on a session bus of its own.
      #
      # **That the Windows leg runs this at all is T34a.** `postgres` refuses a token holding an
      # enabled `BUILTIN\Administrators`, which the step at the top of this job asserts this runner
      # still has; every supervised child is now created from a restricted copy of it —
      # `.claude/decisions/0010-supervised-child-never-inherits-administrators.md`.
      - name: Test against a real PostgreSQL
        if: runner.os != 'Linux' && env.MIXENGINE_POSTGRES_PACKAGE != ''
        timeout-minutes: 15
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-cli --test postgres --locked --offline -- --ignored --nocapture

      # And the one that needs the MySQL — T34c. Its own step for the reason every one above has
      # one: a failure should name which recipe failed without anybody reading the log.
      #
      # The Linux leg runs this from inside `test-no-network.sh`, for MariaDB's reason: the ritual
      # stores a generated root password in the OS credential store and refuses a machine with none.
      #
      # The guard on the variable is what makes the Windows-on-ARM leg green: there is no MySQL to
      # fetch there, and a suite that is `#[ignore]`d until a real server exists has nothing to say.
      - name: Test against a real MySQL
        if: runner.os != 'Linux' && env.MIXENGINE_MYSQL_PACKAGE != ''
        timeout-minutes: 15
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-cli --test mysql --locked --offline -- --ignored --nocapture

      # And the two caches — T35. Two steps rather than one for the reason the PHP pair are two: a
      # failure should name which recipe failed without anybody reading the log.
      - name: Test against a real Redis
        if: runner.os != 'Linux' && env.MIXENGINE_REDIS_PACKAGE != ''
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-cli --test redis --locked --offline -- --ignored --nocapture

      - name: Test against a real memcached
        if: runner.os != 'Linux' && env.MIXENGINE_MEMCACHED_PACKAGE != ''
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-cli --test memcached --locked --offline -- --ignored --nocapture

      # `--all-targets` silently excludes doc tests; run them separately so rustdoc examples cannot
      # rot. The Linux runner did this inside the namespace already.
      - name: Doc tests
        if: runner.os != 'Linux'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test --workspace --all-features --locked --offline --doc

      # rustdoc is the only tool that resolves intra-doc links, and nothing else in CI runs it:
      # clippy does not build the docs, and `cargo test --doc` compiles the examples without
      # checking a single link. `--document-private-items` because most of this workspace is
      # private — a link inside a `mod` that is never exported is exactly the kind that rots. It
      # does not make this a documentation-coverage gate: `missing_docs` still exempts private
      # items, checked by deleting one of their doc comments.
      #
      # `rustdoc::all` is denied in the workspace manifest, so this fails on a developer machine
      # too; RUSTDOCFLAGS stays because it also covers the rustc warnings rustdoc's compile pass
      # raises, which no `[lints]` table can express.
      #
      # Once per OS, not once: every OS directory in mixengine-platform is mapped onto `sys` by
      # `#[path]`, so a host-only run leaves two thirds of that crate unbuilt, and the broken link
      # that created T2a was in the macOS half. It lives in this job rather than in `lint` because
      # `--target` stopped being enough the moment T6 added a dependency that compiles C: rustdoc
      # does not link, but cargo still runs `libsqlite3-sys`'s build script, and cross-compiling
      # SQLite needs a toolchain for the foreign OS that no runner has. Reproduced before moving
      # it — `cargo doc --target x86_64-unknown-linux-gnu` from another host fails in cc-rs with
      # "failed to find tool x86_64-linux-gnu-gcc", not in rustdoc.
      #
      # It runs even when a test failed. In `lint` this check was parallel with the tests; as the
      # last step of `test` it would be skipped by the first failing test instead, hiding every
      # broken intra-doc link until that test was fixed — a check that only runs when everything
      # else already passed is not much of a check. `success() || failure()` rather than
      # `always()`, which would also start it after the job had been cancelled.
      - name: rustdoc
        if: success() || failure()
        env:
          RUSTDOCFLAGS: -D warnings
          CARGO_NET_OFFLINE: "true"
        run: >
          cargo doc --workspace --no-deps --document-private-items --all-features --locked
          --offline

  # The job `.claude/operations/build-and-release.md` says arrives with the first `#[ignore]`d system
  # test. T40 is that task: `mixengine-elevate` creates a root-owned audit directory outside
  # MIXENGINE_HOME, and nothing about that can be proved from an unprivileged process.
  #
  # It runs on every run of this workflow rather than only on branches that touch `platform` or
  # `elevate`, which is what that table used to say: the triggers here are `push: master` and
  # `workflow_dispatch`, and a dispatch carries no diff to test a path filter against.
  system:
    name: system (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: system

      - name: Fetch dependencies
        run: cargo fetch --locked

      # Built as the ordinary user and *run* as root below. `sudo cargo test` would compile a second
      # copy of everything into a target directory root owns, and leave it there for the next job.
      - name: Build the system suite
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-elevate --test system --locked --offline --no-run

      # This leg already holds a full administrator token (T2b, asserted in the `test` job), so there
      # is nothing to raise: running the binary directly is running it elevated.
      # `--test-threads=1`: every test in this suite writes the one audit directory this machine has,
      # which is the whole point of it being a system suite. Run in parallel they interleave on that
      # one directory and assert about each other's half-finished work rather than about the code.
      - name: Elevated suite (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-elevate --test system --locked --offline -- --ignored --nocapture --test-threads=1

      # `sudo -E` keeps SUDO_UID and the cargo environment: the suite hands its request file back to
      # the invoking user, because a root-owned request is exactly what the helper refuses.
      - name: Elevated suite (Unix)
        if: runner.os != 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          suite=$(cargo test -p mixengine-elevate --test system --locked --offline --no-run \
            --message-format=json | jq -r 'select(.profile.test == true) | .executable' | tail -n 1)
          echo "running $suite as root"
          sudo -E "$suite" --ignored --nocapture --test-threads=1

      # T40a's launchers, which are in `mixengine-platform` rather than in the helper: what is under
      # test is the thing that *raises* the prompt. The helper is built explicitly rather than left to
      # the step above, because this suite finds it beside the test binary and a reordering of these
      # steps should not silently turn that into a skip.
      - name: Build the launcher suite
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          cargo build -p mixengine-elevate --locked --offline
          cargo test -p mixengine-platform --test elevation --locked --offline --no-run

      # As the elevated suite above: this leg already holds a full administrator token, so `runas`
      # raises nothing and the round trip runs unattended.
      - name: Launchers (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-platform --test elevation --locked --offline -- --ignored --nocapture --test-threads=1

      # `timeout-minutes` of its own, rather than the job's 20. The macOS leg is a **measurement**:
      # whether `do shell script … with administrator privileges` authenticates on a process that is
      # already root is not something this project can settle by reading. If it prompts, it hangs, and
      # this is the clock that ends it — see the T40a design, "Testing". The Linux leg needs no token
      # at all and asserts the opposite: that a machine with no authentication agent says so.
      - name: Launchers (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 5
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          suite=$(cargo test -p mixengine-platform --test elevation --locked --offline --no-run \
            --message-format=json | jq -r 'select(.profile.test == true) | .executable' | tail -n 1)
          echo "running $suite as root"
          sudo -E "$suite" --ignored --nocapture --test-threads=1

      # T41's hosts engine, against the machine's own `/etc/hosts`. Its unit tests drive the same
      # `apply` against files they own; what only a real machine can answer is whether the replace
      # keeps the file's owner and its ACL, and whether an ordinary token is refused. The test takes
      # a copy first and asserts the file came back byte for byte, so a runner is left as it was.
      - name: Build the hosts suite
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-platform --test hosts --locked --offline --no-run

      - name: The hosts file (Windows)
        if: runner.os == 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo test -p mixengine-platform --test hosts --locked --offline -- --ignored --nocapture --test-threads=1

      # `--test-threads=1` for the elevated suite's reason: there is one hosts file on this machine.
      - name: The hosts file (Unix)
        if: runner.os != 'Windows'
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          suite=$(cargo test -p mixengine-platform --test hosts --locked --offline --no-run \
            --message-format=json | jq -r 'select(.profile.test == true) | .executable' | tail -n 1)
          echo "running $suite as root"
          sudo -E "$suite" --ignored --nocapture --test-threads=1

      # What the suite left behind, so a failure has the evidence beside it.
      - name: The audit log this job produced
        if: always()
        shell: bash
        run: |
          case "${{ runner.os }}" in
            # `ProgramData`, not `PROGRAMDATA`: Windows itself is case-insensitive about the name,
            # but bash is not, and the runner exports it in this spelling. The first run of this
            # step printed "no log at /MixEngine/elevate.log".
            Windows) log="${ProgramData:-C:/ProgramData}/MixEngine/elevate.log" ;;
            macOS)   log="/Library/Logs/MixEngine/elevate.log" ;;
            *)       log="/var/log/mixengine/elevate.log" ;;
          esac
          if [ -f "$log" ]; then cat "$log"; else echo "no log at $log"; fi

  # T29. The performance budgets from .claude/standards/testing.md, of which the shim's is the first
  # to exist. It is a job of its own rather than a step in `test` for two reasons: these are
  # `#[ignore]`d and would otherwise be skipped there anyway, and they need a **release** build,
  # which is a second compilation of the workspace that no correctness answer should have to wait
  # behind.
  #
  # On all three systems, unlike the single-runner row the ops document first sketched: the gate is
  # the same everywhere, but the hand-over it stands in front of is not one mechanism — Unix `exec`s
  # and Windows starts a child inside a Job Object — and the reported wall clock is the only place
  # that difference is ever written down as a number.
  bench:
    name: bench (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # A budget missed on one system is not a reason to stop measuring the other two: the numbers
      # are only comparable when they were all taken.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2
        with:
          key: bench

      - name: Fetch dependencies
        run: cargo fetch --locked

      # `fakeservice` is the program the shim is measured in front of, and it is a **binary of a
      # dev-dependency crate**: selecting one test target does not build it, and a release copy left
      # by an earlier build is used as it is. A stale one is what this step exists for — it was
      # found by the benchmark's own check that the fronted program really ran, having been built
      # before that program learned `--version`, and a benchmark that measures a binary nobody
      # rebuilt is a benchmark measuring last month.
      - name: Build the program the shim is measured against
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo build --release -p mixengine-testkit --bin fakeservice --locked --offline

      # `--test-threads=1` is load-bearing rather than tidiness: both tests spend their whole time
      # creating processes, so run in parallel each of them measures the other — 34 ms against 21 ms
      # for the same difference on the same machine. `--nocapture` because the numbers are the
      # output, and a passing test's stdout is otherwise swallowed.
      - name: Performance budgets
        env:
          CARGO_NET_OFFLINE: "true"
        run: >
          cargo test --release -p mixengine-shim --test overhead --locked --offline
          -- --ignored --nocapture --test-threads=1
