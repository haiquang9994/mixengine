[workspace]
resolver = "3"
members = [
    "crates/mixengine-proto",
    "crates/mixengine-platform",
    "crates/mixengine-supervisor",
    "crates/mixengine-core",
    "crates/mixengine-elevate",
    "crates/mixengine-daemon",
    "crates/mixengine-cli",
    "crates/mixengine-shim",
    "crates/mixengine-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
# Dual licensed the way the Rust ecosystem conventionally is: the user picks either one.
license = "MIT OR Apache-2.0"
repository = "https://github.com/haiquang9994/mixengine"
publish = false

# Dependency direction is strictly downward and is enforced by the test in
# `crates/mixengine-proto/tests/workspace_layering.rs`:
#
#   proto       -> (nothing)
#   platform    -> proto
#   supervisor  -> platform, proto
#   core        -> platform, proto
#   elevate     -> platform, proto
#   daemon      -> core, supervisor, platform, proto
#   cli         -> platform, proto
#   shim        -> core, platform, proto
#
# `mixengine-testkit` sits outside that graph on purpose: it is a **dev-dependency only**, which the
# same test enforces separately, so nothing it contains can reach a shipped binary.
[workspace.dependencies]
mixengine-core = { path = "crates/mixengine-core" }
# `default-features = false` here rather than in the one crate that wants a lean slice: cargo refuses
# a member's `default-features = false` on an inherited dependency whose workspace entry leaves the
# defaults on. So the default is off at the root and every dependent that wants the whole crate says
# `features = ["default"]` — which is all of them but `mixengine-elevate`, the binary that runs as
# root and takes `["elevated"]` alone. See the T40 design, D8.
mixengine-platform = { path = "crates/mixengine-platform", default-features = false }
mixengine-proto = { path = "crates/mixengine-proto" }
mixengine-supervisor = { path = "crates/mixengine-supervisor" }
mixengine-testkit = { path = "crates/mixengine-testkit" }

anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
directories = "6.0.0"
# One `stream::unfold`, for the Server-Sent Events body. Already present through `sqlx`, so this is
# a new edge rather than a new package.
futures-util = { version = "0.3.33", default-features = false }
# Gzip, for the `.tar.gz` half of what the packaging pipeline produces: it packs `.tar.zst` and
# falls back to `.tar.gz` when the runner's tar has no zstd, so both shapes are published and a
# client that reads only one would fail on whichever cell fell back that day. Default features are
# the pure-Rust `miniz_oxide` backend; every `zlib*` feature is a C library this does not need.
flate2 = "1.1.9"
# The one source of randomness in this workspace, and it is here because entropy is the operating
# system's: `getrandom` is `BCryptGenRandom` on Windows, `getentropy` on macOS and `getrandom(2)` on
# Linux, which is exactly the shape every other capability in `mixengine-platform` has. Already in
# the tree through `rustls` and `sqlx`, so this is a new edge rather than a new package — and it is
# the whole of the dependency: no distributions, no PRNG, no seeding, because a password is a
# handful of bytes read once and never a stream.
getrandom = "0.4.3"
# The JSON-RPC transport, per ../standards/rust.md. Features are chosen per crate: the daemon takes
# `server`, its tests take `client`.
http-body-util = "0.1.4"
hyper = { version = "1.11.0", default-features = false }
hyper-util = { version = "0.1.20", default-features = false }
# The OS credential store, per ../standards/rust.md, and the only way a password reaches a managed
# process at all (ADR 0006). `default-features = false` is not a trim here but a requirement: with no
# feature selected this crate compiles a backend that stores nothing and answers every read with
# "no entry", so each OS names its own in `mixengine-platform`'s manifest and a missing one is a
# build that fails rather than a keyring that silently forgets.
keyring = { version = "3.6.3", default-features = false }
# Unix only, and only in `mixengine-platform`: `getuid` for the peer check, and `sockaddr_un` for
# the one length limit that differs between Linux and macOS.
libc = "0.2.189"
# The template engine every generated config file is rendered by, per ../standards/rust.md. Jinja
# rather than a Rust-syntax templating crate because what these templates are is *other languages* —
# a Caddyfile, a `my.cnf`, an `nginx.conf` — and a `{{ }}` that no host language claims is what keeps
# a template readable as the file it produces.
#
# `default-features = false` drops the halves this has no use for: `loader` and `multi_template`
# (templates are compiled into the binary, one per file, and never looked up by name at run time),
# `macros` and `deserialization`, `debug` (its extra failure context is written for somebody editing
# a template, and the only people who edit these are us, with a compile away), and `key_interning`,
# whose thread-local cache pays off across thousands of renders rather than the handful a service
# start costs. What is kept is `builtins` — `default`, `join`, `lower` and the rest, which a template
# without would push into the Rust that calls it — and `serde`, which is how a context reaches a
# template at all.
minijinja = { version = "2.24.0", default-features = false, features = [
    "builtins",
    "serde",
    "std_collections",
] }
# Verifying the package index, and nothing else. By minisign's own author, **zero dependencies**, and
# it handles the pre-hashed form the publishing pipeline actually produces — a hand-rolled
# `ed25519` check over the file bytes would fail every real signature, and would be "fixed" by
# turning the check off. `minisign` (the signing half) is a dev-dependency of `mixengine-testkit`
# and must never appear here: nothing shipped has any business holding a signing key.
minisign-verify = "0.2.5"
# `ReadyCheck::LogPattern`, whose regex `mixengine-proto` deliberately carries as a string: a spec is
# data, and the engine belongs to whoever runs the check. The Unicode features are not a nicety here:
# a feature this crate is missing is not a pattern that behaves differently, it is a pattern that
# **fails to compile at all**, so trimming one turns a spec somebody wrote into a service that never
# becomes ready. `unicode-case` earns its place first — `(?i)ready for connections` is the pattern a
# spec author reaches for before any other, and without it the regex engine refuses the `i` flag
# outright. `unicode-perl` is `\w`, `\d` and `\s`; `unicode-gencat` is `\p{L}` and `\p{N}`. What is
# left out is script, segmentation and case-*folding* tables, which no log line is matched with.
#
# `crates/mixengine-supervisor/src/ready.rs` asserts this set compiles the syntax a spec may use, so
# a future trim is a test that fails rather than a service that hangs for its whole timeout.
# The only outbound HTTP in this workspace: fetching the package index and, from T21, the artifacts
# it names. `hyper` serves the local IPC socket and answers loopback health checks; neither wants a
# TLS stack, and `mixengine-supervisor` says so where it refuses an `https://` check.
#
# Default features are kept rather than trimmed, which is unusual in this file and deliberate. The
# `rustls` default enables `rustls-platform-verifier`, so certificates are judged by the operating
# system's own verifier: MixEngine then works behind a corporate proxy that installs its own root,
# and `MIXENGINE_MIRROR_URL` can name a mirror with an internal certificate. A bundled root store
# would refuse both with nothing the user could do. That is affordable because TLS is not what
# decides whether an index is ours — the Ed25519 signature is, and it is checked after the bytes
# arrive however they arrived.
reqwest = "0.13.4"
regex = { version = "1.13.1", default-features = false, features = [
    "perf",
    "std",
    "unicode-case",
    "unicode-gencat",
    "unicode-perl",
] }
# Zstandard, **decoding only**. The publishing pipeline packs `.tar.zst`, so a client that could not
# read one could install nothing on macOS or Linux. Pure Rust and no build script, which the C
# `zstd` binding is not — and this tree already cross-compiles to `aarch64-pc-windows-msvc`, where
# every avoidable C dependency is one fewer thing to get a toolchain for. Its encoding half is not
# missing but absent by design: nothing shipped writes a zstd stream, and the fixtures that must
# write one use the C `zstd` crate in `mixengine-testkit` instead. That is the same split
# `minisign-verify`/`minisign` uses one layer up, with the same benefit — what the product reads is
# proved against what a *different* implementation wrote.
ruzstd = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The hash every downloaded artifact is checked against, pinned in the signed index
# (../architecture/security-model.md). RustCrypto's, which is what the rest of the ecosystem audits.
# **0.10 rather than the current 0.11**, deliberately: `sqlx` depends on 0.10, both crates that
# want a hash already depend on `sqlx`, and taking the newer one would put two copies of `sha2`,
# `digest` and their `generic-array`/`typenum` chain in the tree for an API this uses four calls of.
# `deny.toml`'s multiple-versions check exists to notice exactly that. Move when sqlx does.
sha2 = "0.10.9"
# Only the pieces SQLite needs. `default-features = false` drops `any` (a runtime-dispatched driver
# for databases we do not speak) and `json` (a column type we do not use — JSON is stored as TEXT
# and parsed by `serde_json`, which is already here). `sqlite-bundled` rather than `sqlite`: the
# umbrella feature also switches on `load-extension`, and a database that can `SELECT
# load_extension('…')` is arbitrary code execution reachable from a data file. `tls-none` is stated
# rather than omitted because sqlx picks a TLS stack when asked for one, and a local file has no
# transport to secure.
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "migrate",
    "macros",
    "tls-none",
] }
# The container inside every `.tar.zst` and `.tar.gz`. Unpacking is where an archive gets to choose
# where its bytes land, so the crate that resolves an entry's path matters more than its size:
# `Entry::unpack_in` refuses to write outside the directory it is given, and this module checks the
# entry path itself before calling it so the refusal is ours and has a test. It is also what keeps
# the mode bits and the symlinks — both of which are the operating system's business and therefore
# belong to a dependency rather than to a `#[cfg]` in `mixengine-core`.
tar = "0.4.46"
thiserror = "2.0.20"
tokio = "1.53.1"
# `CancellationToken`, which ../standards/rust.md names as the shutdown path every spawned task
# hangs off. Written by the tokio project and versioned with it; the `sync` module it lives in needs
# no feature, so `default-features = false` leaves the codec, io and net helpers out of the build.
tokio-util = { version = "0.7.18", default-features = false }
toml = "1.1.4"
# Writing `mixengine.toml` back (T39). `toml` cannot: a `Value` carries no formatting, so
# serialising a fresh document over the user's file would take their comments, their key order and
# the `[site]` block they wrote by hand with it — to the one file whose entire purpose is to be
# read by a person. Already in `Cargo.lock` at this version underneath `toml` itself, so this is a
# new *direct* edge rather than a new subtree.
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# `windows-sys` rather than `windows`, which ../standards/rust.md names: both are Microsoft's and
# generated from the same metadata, but `windows-sys` is already in this tree — tokio, mio and
# socket2 all depend on it — so the named-pipe security work costs no new dependency and no second
# copy of the same bindings, which `deny.toml`'s multiple-versions check would report. The ban that
# matters is on `winapi`, and it stays.
windows-sys = "0.61.2"
# The Windows half of what the pipeline publishes. `default-features = false` with `deflate-flate2`
# alone is not a trim for its own sake: the defaults compile bzip2, lzma, xz, ppmd, deflate64, AES
# and a second zstd, which are six more decompressors reachable from a downloaded file than any
# artifact this project publishes uses — `php_windows.py` packs with `ZIP_DEFLATED` and nothing
# else. The backend is the `flate2` already above rather than a second copy of one.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

cargo_metadata = "0.23.1"
tempfile = "3.24.0"
# The encoding half of `ruzstd`, and a **dev-dependency of `mixengine-testkit` only** — see the note
# on `ruzstd` for why the two are deliberately different implementations. This one binds the
# reference C library, which is affordable here and would not be in a shipped binary.
zstd = "0.13.3"

# Lints apply to every member through `[lints] workspace = true`.
[workspace.lints.rust]
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"

# Intra-doc links are resolved by rustdoc and by nothing else, so a link to an item that does not
# exist is invisible to `clippy` and to `cargo test --doc` alike. Denied here rather than only
# through `RUSTDOCFLAGS` in CI so that a plain `cargo doc` fails on a developer machine too — CI
# sets the variable as well, which additionally covers the rustc warnings rustdoc's compile pass
# raises.
[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
# Debug info goes, symbol names stay: a daemon crash report is worthless without function names,
# and "copy diagnostics" (T66) is meant to produce something a human can act on.
strip = "debuginfo"
# `panic = "abort"` must never be set: the RPC layer catches a panic per request and returns
# `internal` instead of taking every managed service down with it.
